  // ¿El partido actual tiene datos (para advertir antes de sobrescribir)?
  function gameHasData(){ return !!(game && ((game.log&&game.log.length)||game.themPts||usScore())); }
  // Carga un partido guardado en la vista en vivo (misma tabla + tiros).
  function loadHistory(g){
    const rs=(g.roster&&g.roster.length)? g.roster : (g.stats||[]);
    roster=rs.map(function(p){ return {id:p.id||uid(), name:p.name||'', num:p.num||'', height:p.height||'', birth:p.birth||'', tmp:!!p.tmp}; });
    const stats={};
    (g.stats||[]).forEach(function(p,idx){ const id=p.id||(roster[idx]&&roster[idx].id); if(!id) return;
      const c=emptyCnt(); const src=p.c||{}; for(const k in c) c[k]=src[k]||0; stats[id]=c; });
    game={ rival:g.rival||'', themPts:g.them||0, stats:stats, log:(g.log||[]).slice(), shots:(g.shots||[]).slice(),
      themQ:Object.assign({},g.themQ||{}), period:g.period||1, present:roster.map(function(p){return p.id;}) };
    viewPeriod=0; selPlayer=null;                     // se abre en “Total”
    saveRoster(); saveGame(); renderStats();
    toast('Partido cargado: vs '+(g.rival||'Rival'));
  }

  // ---- Historial de partidos guardados ----
  function openHistory(){
    let hist=[]; try{ hist=JSON.parse(localStorage.getItem(HIST_KEY))||[]; }catch(e){}
    let ov=document.getElementById('histOv'); if(ov) ov.remove();
    ov=document.createElement('div'); ov.id='histOv';
    ov.style.cssText='position:fixed;inset:0;z-index:9600;background:rgba(8,12,10,.9);display:flex;align-items:center;justify-content:center;padding:16px;font-family:system-ui,-apple-system,sans-serif';
    document.body.appendChild(ov);
    function fmt(d){ if(!d) return ''; try{ return new Date(d).toLocaleDateString('es-CL',{day:'2-digit',month:'short',year:'numeric'}); }catch(e){ return ''; } }
    function detail(g){
      const cols=[['pts','PTS'],['m2','2P'],['m3','3P'],['mft','TL'],['reb','REB'],['ast','AST'],['stl','ROB'],['blk','TAP'],['tov','PÉR'],['pf','FAL']];
      let h='<table style="width:100%;border-collapse:collapse;font-size:.82rem"><thead><tr style="color:#8aa;text-align:right"><th style="text-align:left">Jugador</th>'+cols.map(c=>'<th>'+c[1]+'</th>').join('')+'</tr></thead><tbody>';
      (g.stats||[]).forEach(function(p){ const c=p.c||{}; const pts=2*(c.m2||0)+3*(c.m3||0)+(c.mft||0);
        h+='<tr style="text-align:right;border-top:1px solid #1e2a22"><td style="text-align:left;padding:3px 0">'+(p.num?('#'+p.num+' '):'')+escapeHtml(p.name||'')+'</td>'
          +'<td><b>'+pts+'</b></td><td>'+(c.m2||0)+'/'+(c.a2||0)+'</td><td>'+(c.m3||0)+'/'+(c.a3||0)+'</td><td>'+(c.mft||0)+'/'+(c.aft||0)+'</td>'
          +'<td>'+(c.reb||0)+'</td><td>'+(c.ast||0)+'</td><td>'+(c.stl||0)+'</td><td>'+(c.blk||0)+'</td><td>'+(c.tov||0)+'</td><td>'+(c.pf||0)+'</td></tr>';
      });
      return h+'</tbody></table>';
    }
    function rows(){
      if(!hist.length) return '<div style="color:#8aa;padding:14px 4px">Aún no hay partidos guardados. Al terminar un partido usa “Guardar partido”.</div>';
      return hist.map(function(g,i){ const win=g.us>g.them;
        return '<div style="border-bottom:1px solid #1e2a22;padding:9px 4px">'
          +'<div style="display:flex;align-items:center;gap:10px">'
            +'<span style="color:#8aa;font-size:.78rem;width:74px">'+fmt(g.date)+'</span>'
            +'<b style="flex:1;min-width:60px">vs '+escapeHtml(g.rival||'Rival')+'</b>'
            +'<b style="color:'+(win?'#37b26b':'#e0605a')+';font-variant-numeric:tabular-nums">'+g.us+' – '+g.them+'</b>'
            +'<button data-open="'+i+'" style="background:none;border:1px solid #33443a;color:#cfe0d6;border-radius:8px;padding:3px 9px;cursor:pointer;font-size:.8rem">ver</button>'
            +'<button data-load="'+i+'" title="Cargar en la vista" style="background:#1f9b57;border:0;color:#fff;border-radius:8px;padding:3px 11px;cursor:pointer;font-size:.8rem;font-weight:700">Cargar</button>'
            +'<button data-del="'+i+'" title="Eliminar" style="background:none;border:0;color:#b55;cursor:pointer;font-size:1.15rem">×</button>'
          +'</div>'
          +'<div id="hg'+i+'" style="display:none;margin-top:8px;overflow:auto"></div>'
        +'</div>';
      }).join('');
    }
    function draw(){
      ov.innerHTML='<div style="background:#101613;border:1px solid #26332b;border-radius:16px;max-width:640px;width:100%;color:#eaf2ec;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 60px -20px #000">'
        +'<div style="padding:14px 18px;border-bottom:1px solid #26332b;display:flex;justify-content:space-between;align-items:center"><b style="font-size:1.15rem">Partidos guardados</b><button id="hX" style="background:none;border:0;color:#8aa;font-size:1.5rem;cursor:pointer;line-height:1">&times;</button></div>'
        +'<div id="hList" style="padding:4px 16px 14px;overflow:auto">'+rows()+'</div></div>';
      ov.querySelector('#hX').onclick=function(){ ov.remove(); };
      [].forEach.call(ov.querySelectorAll('[data-open]'),function(b){ b.onclick=function(){ const i=b.getAttribute('data-open'); const d=ov.querySelector('#hg'+i);
        if(d.style.display==='none'){ if(!d.innerHTML) d.innerHTML=detail(hist[i]); d.style.display='block'; b.textContent='ocultar'; } else { d.style.display='none'; b.textContent='ver'; } }; });
      [].forEach.call(ov.querySelectorAll('[data-load]'),function(b){ b.onclick=function(){ const i=+b.getAttribute('data-load');
        if(gameHasData() && !confirm('Hay un partido en curso. Cargar este reemplazará lo que ves ahora (el guardado no se pierde). ¿Continuar?')) return;
        ov.remove(); loadHistory(hist[i]); }; });
      [].forEach.call(ov.querySelectorAll('[data-del]'),function(b){ b.onclick=function(){ const i=+b.getAttribute('data-del');
        if(confirm('¿Eliminar este partido del historial?')){ hist.splice(i,1); try{ localStorage.setItem(HIST_KEY,JSON.stringify(hist)); }catch(e){} draw(); } }; });
    }
    draw();
  }

  // ---- Gráfico de lanzamientos (mapa de tiros) ----
  function openShots(){
    let ov=document.getElementById('shotsOv'); if(ov) ov.remove();
    ov=document.createElement('div'); ov.id='shotsOv';
    ov.style.cssText='position:fixed;inset:0;z-index:9600;background:rgba(8,12,10,.92);display:flex;align-items:center;justify-content:center;padding:14px;font-family:system-ui,-apple-system,sans-serif';
    document.body.appendChild(ov);
    let fP='', fQ=0;
    const COURT=HALFCOURT;
    function chipCss(on){ return 'padding:7px 11px;border-radius:9px;border:1px solid '+(on?'#1f9b57':'#33443a')+';background:'+(on?'#1f9b57':'#0b100d')+';color:'+(on?'#fff':'#eaf2ec')+';font-weight:700;cursor:pointer'; }
    function filtered(){ return (game.shots||[]).filter(function(s){ return (!fP||s.p===fP) && (!fQ||(s.q||1)===fQ); }); }
    function markers(){ return filtered().map(function(s){ const x=+(s.x*500).toFixed(1), y=+(s.y*470).toFixed(1);
      return s.made ? '<circle cx="'+x+'" cy="'+y+'" r="8" fill="#1f9b57" stroke="#0a3b22" stroke-width="1.5"/>'
        : '<path d="M'+(x-7)+' '+(y-7)+' l14 14 M'+(x+7)+' '+(y-7)+' l-14 14" stroke="#e0453f" stroke-width="3" stroke-linecap="round"/>'; }).join(''); }
    function stat(){ const f=filtered(), made=f.filter(s=>s.made).length, att=f.length; return made+'/'+att+' ('+(att?Math.round(made/att*100):0)+'%)'; }
    function nameOf(pid){ const p=roster.find(x=>x.id===pid); return p?((p.num?'#'+p.num+' ':'')+p.name):''; }
    function registerShotStat(pid,type,made){ const id=type===3?(made?'m3':'x3'):(made?'m2':'x2'); const a=ACTIONS.find(x=>x.id===id); const c=cnt(pid); if(a) for(const k in a.inc) c[k]+=a.inc[k]; game.log.push({p:pid,a:id,q:game.period}); }
    function askShot(cx,cy,fx,fy){
      let pop=document.getElementById('shotPop'); if(pop) pop.remove();
      pop=document.createElement('div'); pop.id='shotPop';
      pop.style.cssText='position:fixed;z-index:9700;left:'+Math.min(cx,window.innerWidth-160)+'px;top:'+Math.min(cy,window.innerHeight-110)+'px;background:#101613;border:1px solid #33443a;border-radius:12px;padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:6px;box-shadow:0 12px 30px -10px #000';
      const bt=function(l,bg){ return '<button style="background:'+bg+';border:0;color:#fff;font-weight:700;border-radius:8px;padding:10px 12px;cursor:pointer">'+l+'</button>'; };
      pop.innerHTML=bt('2 ✓','#1f9b57')+bt('3 ✓','#1f9b57')+bt('2 ✕','#e0453f')+bt('3 ✕','#e0453f');
      document.body.appendChild(pop);
      const defs=[[2,true],[3,true],[2,false],[3,false]];
      [].forEach.call(pop.querySelectorAll('button'),function(b,i){ b.onclick=function(){ const d=defs[i];
        registerShotStat(fP,d[0],d[1]); game.shots.push({p:fP,type:d[0],made:d[1],x:clamp(fx),y:clamp(fy),q:game.period});
        saveGame(); renderSheet(); updateScore(); updateUndo(); pop.remove(); draw(); }; });
    }
    function draw(){
      ov.innerHTML='<div style="background:#101613;border:1px solid #26332b;border-radius:16px;max-width:520px;width:100%;color:#eaf2ec;max-height:94vh;display:flex;flex-direction:column;overflow:auto;box-shadow:0 30px 60px -20px #000">'
        +'<div style="padding:12px 16px;border-bottom:1px solid #26332b;display:flex;justify-content:space-between;align-items:center"><b style="font-size:1.1rem">Lanzamientos</b><button id="sX" style="background:none;border:0;color:#8aa;font-size:1.5rem;cursor:pointer;line-height:1">&times;</button></div>'
        +'<div style="padding:10px 14px 4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">'
          +'<select id="sP" style="padding:8px 10px;border-radius:9px;border:1px solid #33443a;background:#0b100d;color:#eaf2ec">'+'<option value="">Todos</option>'+roster.map(function(p){return '<option value="'+p.id+'"'+(fP===p.id?' selected':'')+'>'+escapeHtml((p.num?'#'+p.num+' ':'')+p.name)+'</option>';}).join('')+'</select>'
          +PERIODS.map(function(p){ return '<button class="sQ" data-q="'+p[0]+'" style="'+chipCss(fQ===p[0])+'">'+(p[0]===0?'Todos':p[1])+'</button>'; }).join('')
        +'</div>'
        +'<div style="padding:2px 14px 4px;color:#9fb0a5;font-size:.85rem">'+(fP?escapeHtml(nameOf(fP))+' · ':'')+stat()+' &nbsp;<span style="color:#1f9b57">●</span> anotado &nbsp;<span style="color:#e0453f">✕</span> fallado</div>'
        +'<div style="padding:4px 12px 6px"><svg id="sCourt" viewBox="0 0 500 470" style="width:100%;height:auto;touch-action:none;border-radius:10px;display:block">'+COURT+'<g>'+markers()+'</g></svg></div>'
        +'<div style="padding:0 14px 12px;color:#8aa;font-size:.8rem">'+(fP?'Toca la cancha donde fue el tiro y elige 2/3, anotado o fallado.':'Elige un jugador arriba para registrar sus tiros tocando la cancha.')+'</div></div>';
      ov.querySelector('#sX').onclick=function(){ ov.remove(); renderStats(); };
      ov.querySelector('#sP').onchange=function(){ fP=this.value; draw(); };
      [].forEach.call(ov.querySelectorAll('.sQ'),function(b){ b.onclick=function(){ fQ=+b.getAttribute('data-q'); draw(); }; });
      const svg=ov.querySelector('#sCourt');
      svg.addEventListener('pointerdown',function(e){ if(!fP){ toast('Elige un jugador primero'); return; } const r=svg.getBoundingClientRect(); askShot(e.clientX,e.clientY,(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height); });
    }
    draw();
  }

  const SHOT2=['m2','x2'], SHOT3=['m3','x3'];
  function applyCounter(a,pid,xy){
    const c=cnt(pid);
    for(const k in a.inc) c[k]+=a.inc[k];
    game.log.push({p:pid,a:a.id,q:game.period});
    if(xy){ game.shots.push({p:pid, type:(SHOT3.indexOf(a.id)>=0?3:2), made:(a.id==='m2'||a.id==='m3'), x:clamp(xy.x), y:clamp(xy.y), q:game.period}); }
    const p=roster.find(x=>x.id===pid);
    selPlayer=null;                                   // secuencia lista → volver a la grilla de jugadores
    saveGame(); renderRosterBar(); renderSheet(); updateScore(); updateUndo();
    toast((p?((p.num?'#'+p.num+' ':'')+p.name):'')+' · '+a.label+(a.small&&a.small.length>3?' '+a.small:''));
  }
  function applyAction(a){
    if(!selPlayer){ toast('Elige un jugador primero'); return; }
    const pid=selPlayer;
    if(SHOT2.indexOf(a.id)>=0 || SHOT3.indexOf(a.id)>=0){
      pickShotLocation(a,pid,function(xy){ applyCounter(a,pid,xy); });
    } else {
      applyCounter(a,pid,null);
    }
  }
  // Overlay de media cancha para ubicar el lanzamiento (o saltar la ubicación).
  function pickShotLocation(a,pid,cb){
    const p=roster.find(x=>x.id===pid);
    let ov=document.getElementById('shotLocOv'); if(ov) ov.remove();
    ov=document.createElement('div'); ov.id='shotLocOv';
    ov.style.cssText='position:fixed;inset:0;z-index:9700;background:rgba(8,12,10,.92);display:flex;align-items:center;justify-content:center;padding:14px;font-family:system-ui,-apple-system,sans-serif';
    const made=(a.id==='m2'||a.id==='m3'), tipo=(SHOT3.indexOf(a.id)>=0?'3P':'2P');
    ov.innerHTML='<div style="background:#101613;border:1px solid #26332b;border-radius:16px;max-width:460px;width:100%;color:#eaf2ec;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 60px -20px #000">'
      +'<div style="padding:12px 16px;border-bottom:1px solid #26332b;display:flex;justify-content:space-between;align-items:center"><b style="font-size:1.05rem">'+escapeHtml((p&&p.num?'#'+p.num+' ':'')+(p?p.name:''))+' · '+tipo+' '+(made?'✓':'✕')+'</b><button id="slX" style="background:none;border:0;color:#8aa;font-size:1.5rem;cursor:pointer;line-height:1">&times;</button></div>'
      +'<div style="padding:8px 14px 2px;color:#9fb0a5;font-size:.85rem">Toca la cancha donde fue el lanzamiento.</div>'
      +'<div style="padding:6px 12px"><svg id="slCourt" viewBox="0 0 500 470" style="width:100%;height:auto;touch-action:none;border-radius:10px;display:block">'+HALFCOURT+'</svg></div>'
      +'<div style="padding:8px 14px 14px;display:flex;gap:8px;justify-content:space-between"><button id="slSkip" style="background:#0c120f;border:1px solid #33443a;color:#eaf2ec;border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600">Sin ubicación</button><button id="slCancel" style="background:none;border:1px solid #33443a;color:#8aa;border-radius:10px;padding:9px 14px;cursor:pointer">Cancelar</button></div></div>';
    document.body.appendChild(ov);
    ov.querySelector('#slX').onclick=function(){ ov.remove(); };
    ov.querySelector('#slCancel').onclick=function(){ ov.remove(); };
    ov.querySelector('#slSkip').onclick=function(){ ov.remove(); cb(null); };
    const svg=ov.querySelector('#slCourt');
    svg.addEventListener('pointerdown',function(e){ const r=svg.getBoundingClientRect();
      ov.remove(); cb({x:(e.clientX-r.left)/r.width, y:(e.clientY-r.top)/r.height}); });
  }
  function undo(){
    const last=game.log.pop(); if(!last) return;
    const a=ACTIONS.find(x=>x.id===last.a); const c=cnt(last.p);
    if(a) for(const k in a.inc) c[k]=Math.max(0,c[k]-a.inc[k]);
    saveGame(); renderSheet(); updateScore(); updateUndo();
  }
  function updateUndo(){ document.getElementById('btnUndo').disabled=!game.log.length; }
  function themAdd(n){ game.themPts=Math.max(0,(game.themPts||0)+n); game.themQ[game.period]=Math.max(0,(game.themQ[game.period]||0)+n); saveGame(); updateScore(); }
  function updateScore(){
    document.getElementById('scoreUs').textContent=usScore();
    document.getElementById('scoreThem').textContent=game.themPts||0;
  }

  // Divide el nombre en dos líneas: nombres arriba, apellidos abajo.
  // Chile suele usar 2 apellidos; si hay 3+ palabras, las 2 últimas son apellidos.
  function nameLines(name){
    const w=(name||'').trim().split(/\s+/).filter(Boolean);
    if(w.length<=1) return [w.join(' '),''];
    const cut = w.length>=4 ? w.length-2 : (w.length===3 ? 1 : 1);
    return [w.slice(0,cut).join(' '), w.slice(cut).join(' ')];
  }
  function renderRosterBar(){
    const bar=document.getElementById('rosterBar'); bar.innerHTML='';
    const pad=document.getElementById('actionPad'), hint=document.getElementById('padHint');
    if(selPlayer){
      // --- Detalle del jugador: cabecera + acciones visibles ---
      const p=roster.find(x=>x.id===selPlayer); const c=viewCnt(selPlayer);
      const head=document.createElement('div'); head.className='detail-head';
      head.innerHTML='<button class="back" title="Volver">‹ Volver a jugadores</button>'
        +'<div class="who"><span class="num">'+(p&&p.num?p.num:'–')+'</span><b>'+escapeHtml(p?p.name:'')+'</b></div>'
        +'<div class="mini">'+ptsOf(c)+' PTS · '+(c.m2+c.m3)+'/'+(c.a2+c.a3)+' T · '+c.reb+' REB · '+c.ast+' AST</div>';
      head.querySelector('.back').onclick=()=>{ selPlayer=null; renderRosterBar(); renderSheet(); };
      bar.appendChild(head);
      if(pad) pad.style.display='';
      if(hint) hint.style.display='';
    } else {
      // --- Cuadros de jugadores (estilo tarjetas) ---
      const grid=document.createElement('div'); grid.className='roster-grid';
      presentRoster().forEach(p=>{
        const c=viewCnt(p.id);
        const el=document.createElement('button'); el.className='pbox';
        const nl=nameLines(p.name);
        const nameHtml='<span class="l1">'+escapeHtml(nl[0])+'</span>'+(nl[1]?'<span class="l2">'+escapeHtml(nl[1])+(p.tmp?' <em>parche</em>':'')+'</span>':(p.tmp?'<span class="l2"><em>parche</em></span>':''));
        el.innerHTML='<span class="pb-num">'+(p.num||'–')+'</span><span class="pb-name">'+nameHtml+'</span><span class="pb-pts">'+ptsOf(c)+'<small>PTS</small></span>';
        el.onclick=()=>{ selPlayer=p.id; renderRosterBar(); renderSheet(); updatePadHint(); };
        grid.appendChild(el);
      });
      bar.appendChild(grid);
      const acts=document.createElement('div'); acts.className='roster-acts';
      const conv=document.createElement('button'); conv.className='pchip add'; conv.innerHTML='✔ Convocatoria'; conv.onclick=openConvocatoria; acts.appendChild(conv);
      const add=document.createElement('button'); add.className='pchip add'; add.innerHTML='＋ Jugador'; add.onclick=addPlayer; acts.appendChild(add);
      bar.appendChild(acts);
      if(pad) pad.style.display='none';
      if(hint) hint.style.display='none';
    }
  }
  function updatePadHint(){
    const p=roster.find(x=>x.id===selPlayer);
    const hint=document.getElementById('padHint');
    if(hint) hint.textContent = p? ('Registrando a #'+(p.num||'–')+' '+p.name) : 'Selecciona un jugador y toca la acción.';
    document.querySelectorAll('#actionPad button').forEach(b=>b.disabled=!selPlayer);
  }
  function renderActionPad(){
    const pad=document.getElementById('actionPad'); pad.innerHTML='';
    ACTIONS.forEach(a=>{
      const b=document.createElement('button');
      if(a.cls) b.className=a.cls;
      b.innerHTML=`${a.label}<small>${a.small||''}</small>`;
      b.onclick=()=>applyAction(a);
      pad.appendChild(b);
    });
    updatePadHint();
  }
  function renderSheet(){
    const t=document.getElementById('statSheet');
    let h='<thead><tr><th>Jugador</th>'+COLS.slice(1).map(c=>'<th>'+c[1]+'</th>').join('')+'<th>PTS</th></tr></thead><tbody>';
    const pres=presentRoster();
    if(!roster.length){ h+='<tr class="empty-row"><td colspan="'+(COLS.length+1)+'">Agrega jugadores o usa la Convocatoria para llevar la estadística.</td></tr>'; }
    else if(!pres.length){ h+='<tr class="empty-row"><td colspan="'+(COLS.length+1)+'">Nadie convocado. Abre “Convocatoria” y marca los presentes.</td></tr>'; }
    const tot=emptyCnt();
    pres.forEach(p=>{
      const c=viewCnt(p.id); CNT.forEach(k=>tot[k]+=c[k]);
      h+=`<tr class="${selPlayer===p.id?'sel':''}"><td><span class="pnum">${p.num||'–'}</span><span class="pname">${escapeHtml(p.name)}</span></td>`+
        `<td>${c.m2}/${c.a2}</td><td>${c.m3}/${c.a3}</td><td>${c.mft}/${c.aft}</td>`+
        `<td>${c.reb}</td><td>${c.ast}</td><td>${c.stl}</td><td>${c.blk}</td><td>${c.tov}</td><td>${c.pf}</td>`+
        `<td class="pts">${ptsOf(c)}</td></tr>`;
    });
    if(pres.length){
      h+=`<tr class="tot"><td>TOTAL</td>`+
        `<td>${tot.m2}/${tot.a2}</td><td>${tot.m3}/${tot.a3}</td><td>${tot.mft}/${tot.aft}</td>`+
        `<td>${tot.reb}</td><td>${tot.ast}</td><td>${tot.stl}</td><td>${tot.blk}</td><td>${tot.tov}</td><td>${tot.pf}</td>`+
        `<td class="pts">${ptsOf(tot)}</td></tr>`;
    }
    h+='</tbody>';
    t.innerHTML=h;
  }
  function renderStats(){
    document.getElementById('rivalInput').value=game.rival||'';
    document.getElementById('rivalName').textContent=game.rival||'Rival';
    renderPeriodBar(); renderRosterBar(); renderActionPad(); renderSheet(); updateScore(); updateUndo();
  }

  function exportStatsCSV(){
    const head=['Jugador','Número','2P_anotados','2P_intentados','3P_anotados','3P_intentados','TL_anotados','TL_intentados','Rebotes','Asistencias','Robos','Tapas','Pérdidas','Faltas','Puntos'];
    const rows=presentRoster().map(p=>{ const c=cnt(p.id); return [p.name,p.num||'',c.m2,c.a2,c.m3,c.a3,c.mft,c.aft,c.reb,c.ast,c.stl,c.blk,c.tov,c.pf,ptsOf(c)]; });
    const esc=v=>{ v=String(v); return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
    let csv=head.join(';')+'\n'+rows.map(r=>r.map(esc).join(';')).join('\n');
    csv+=`\n\nGreen Bears;${usScore()};;Rival (${(game.rival||'')});${game.themPts||0}`;
    saveFile('estadisticas-'+((game.rival||'partido').replace(/[^\w-]+/g,'_'))+'.csv', '﻿'+csv);
  }
  function finishGame(){
    if(!roster.length){ toast('No hay jugadores'); return; }
    if(!confirm('¿Guardar el partido y empezar uno nuevo? (el actual queda respaldado)')) return;
    let hist=[]; try{ hist=JSON.parse(localStorage.getItem(HIST_KEY))||[]; }catch(e){}
    const pres=presentRoster();
    hist.push({date:new Date().toISOString(), rival:game.rival||'', us:usScore(), them:game.themPts||0,
      stats:pres.map(p=>({id:p.id,name:p.name,num:p.num,height:p.height,birth:p.birth,tmp:p.tmp,c:cnt(p.id)})),
      roster:pres.map(p=>({id:p.id,name:p.name,num:p.num,height:p.height,birth:p.birth,tmp:p.tmp})),
      log:(game.log||[]).slice(), shots:(game.shots||[]).slice(), themQ:Object.assign({},game.themQ||{}), period:game.period||1});
    try{ localStorage.setItem(HIST_KEY,JSON.stringify(hist)); }catch(e){}
    game={rival:'',themPts:0,stats:{},log:[],shots:[],period:1,themQ:{}}; viewPeriod=1; saveGame(); selPlayer=null; renderStats();
    toast('Partido guardado. Nuevo partido listo.');
  }
  function resetGame(){
    if(!confirm('¿Reiniciar el partido actual a cero? (no toca la plantilla)')) return;
    game={rival:game.rival||'',themPts:0,stats:{},log:[],period:1,themQ:{}}; viewPeriod=1; saveGame(); renderStats();
  }

  // ============================================================
  //  Refresco global
  // ============================================================
  function refreshAll(){
    buildPlaySelect(); buildCourt(); buildRail(); buildSteps(); buildScrub();
    if(mode==='present'){ curFrame=0; showNote(0,true); }
  }

  // ============================================================
  //  Eventos de la UI
  // ============================================================
  document.querySelectorAll('#modeSeg button').forEach(b=> b.onclick=()=>setMode(b.dataset.mode));
  playSelect.onchange=()=>{ curId=playSelect.value; curFrame=0; stopAnim(); refreshAll(); setMode(mode); };
  $('#btnNew').onclick=()=> promptName('Nueva jugada','',n=>{ const np=newPlay(n); book.push(np); curId=np.id; curFrame=0; save(); refreshAll(); setMode('edit'); });
  $('#btnMenu').onclick=menu;
  $('#btnAddStep').onclick=()=>addStep(false);
  $('#btnDupStep').onclick=()=>addStep(true);
  $('#btnCourt').onclick=()=>{ play().court = play().court==='half'?'full':'half'; save(); buildCourt(); buildRail(); };
  $('#btnClear').onclick=()=>{ frame().arrows=[]; save(); render(); };
  $('#btnReset').onclick=()=>{ frame().pos=startPos(); save(); render(); };
  noteInput.addEventListener('input',()=>{ frame().note=noteInput.value; save();
    const st=stepList.children[curFrame]; if(st) st.querySelector('.t').textContent=noteInput.value||'Sin nota…'; });

  $('#pPlay').onclick=()=>{ if(anim&&anim.playing){ stopAnim(); } else { playFrom(curFrame>=play().frames.length-1?0:curFrame); } };
  $('#pPrev').onclick=()=>{ stopAnim(); selectFrame(curFrame-1); showNote(curFrame,true); };
  $('#pNext').onclick=()=>{ stopAnim(); selectFrame(curFrame+1); showNote(curFrame,true); };
  $('#pReset').onclick=()=>{ stopAnim(); selectFrame(0); showNote(0,true); };
  $('#speed').oninput=()=>{ if(anim) anim.speed=parseFloat($('#speed').value)||1; };

  // ---- Estadísticas ----
  $('#rivalInput').addEventListener('input',()=>{ game.rival=$('#rivalInput').value; document.getElementById('rivalName').textContent=game.rival||'Rival'; saveGame(); });
  $('#btnUndo').onclick=undo;
  $('#btnPlantel').onclick=openPlantel;
  $('#btnShots').onclick=openShots;
  $('#btnHistory').onclick=openHistory;
  $('#btnStatExport').onclick=exportStatsCSV;
  $('#btnStatFinish').onclick=finishGame;
  $('#btnStatReset').onclick=resetGame;
  $('#btnThemMinus').onclick=()=>themAdd(-1);
  document.querySelectorAll('.them-pts .chip').forEach(b=>b.onclick=()=>themAdd(parseInt(b.dataset.them,10)));

  // teclado (útil con teclado del iPad)
  window.addEventListener('keydown',e=>{
    if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT') return;
    if(mode==='present'){
      if(e.key===' '){ e.preventDefault(); $('#pPlay').click(); }
      if(e.key==='ArrowRight') $('#pNext').click();
      if(e.key==='ArrowLeft') $('#pPrev').click();
    }
  });

  // evitar scroll/zoom por gestos en la cancha
  document.addEventListener('gesturestart',e=>e.preventDefault());

  // ============================================================
  //  Arranque
  // ============================================================
  loadStats();
  ensureLibrary(false);
  applyBrandLogo();
  refreshAll();
  setMode('edit');

  // Accesos directos de la PWA (?go=stats | ?go=nueva).
  (function(){ try{ var go=new URLSearchParams(location.search).get('go');
    if(go==='stats') setMode('stats');
    else if(go==='nueva'){ var b=document.getElementById('btnNew'); if(b) b.click(); }
  }catch(e){} })();

  // Equipo enlazado (Green Bears) sin logo local: traer el logo del club del sitio.
  (function(){ try{ var t=window.__pzTeam;
    if(t&&t.id&&t.linked&&!teamLogo()){
      fetch('/pizarra/api/teams/'+t.id,{credentials:'same-origin',headers:{'x-pizarra':'1'}})
        .then(function(r){return r.json();}).then(function(d){
          if(d&&d.clubLogo){ try{ localStorage.setItem(LOGO_KEY,d.clubLogo); }catch(e){} applyBrandLogo(); buildCourt(); }
        }).catch(function(){});
    } }catch(e){} })();

  // ===== PWA: registrar service worker para uso sin conexión =====
  // Solo corre bajo HTTPS o localhost (en el iframe del preview puede no estar
  // permitido; se ignora silenciosamente).
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    });
  }

  // ===== PWA: botón "Instalar app" (Android/Chrome) + guía para iPad/iOS =====
  (function(){
    function isStandalone(){ return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true; }
    if(isStandalone()) return;                                   // ya instalada: nada que mostrar
    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
    let deferred=null, dismissed=false;
    try{ dismissed = localStorage.getItem('pizarra.installHide')==='1'; }catch(e){}

    const chip=document.createElement('button');
    chip.id='pwaInstall';
    chip.style.cssText='position:fixed;right:14px;bottom:14px;z-index:9200;display:none;align-items:center;gap:8px;'
      +'background:#1f9b57;color:#fff;border:0;border-radius:999px;padding:11px 16px;font:600 14px system-ui,-apple-system,sans-serif;'
      +'box-shadow:0 10px 26px -8px rgba(0,0,0,.6);cursor:pointer';
    chip.innerHTML='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 21h16"/></svg> Instalar app';
    document.body.appendChild(chip);

    function show(){ if(!dismissed) chip.style.display='inline-flex'; }
    function hide(){ chip.style.display='none'; }

    // Android/Chrome: capturamos el evento y mostramos el botón.
    window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); deferred=e; show(); });
    window.addEventListener('appinstalled', function(){ hide(); try{ localStorage.setItem('pizarra.installHide','1'); }catch(e){} });

    // iOS/iPadOS no dispara beforeinstallprompt: mostramos el botón igual (guía manual).
    if(isIOS) show();

    chip.onclick=function(){
      if(deferred){ deferred.prompt(); deferred.userChoice.finally(function(){ deferred=null; hide(); }); return; }
      iosGuide();                                                // iOS o navegadores sin prompt
    };

    function iosGuide(){
      let ov=document.getElementById('pwaGuide'); if(ov) ov.remove();
      ov=document.createElement('div'); ov.id='pwaGuide';
      ov.style.cssText='position:fixed;inset:0;z-index:9800;background:rgba(8,12,10,.9);display:flex;align-items:center;justify-content:center;padding:18px;font-family:system-ui,-apple-system,sans-serif';
      ov.innerHTML='<div style="background:#101613;border:1px solid #26332b;border-radius:16px;max-width:400px;width:100%;color:#eaf2ec;overflow:hidden;box-shadow:0 30px 60px -20px #000">'
        +'<div style="padding:14px 18px;border-bottom:1px solid #26332b;display:flex;justify-content:space-between;align-items:center"><b style="font-size:1.05rem">Instalar en tu iPad / iPhone</b><button id="pgX" style="background:none;border:0;color:#8aa;font-size:1.5rem;cursor:pointer;line-height:1">&times;</button></div>'
        +'<ol style="margin:0;padding:16px 20px 4px;line-height:1.7;font-size:.95rem">'
          +'<li>Abre esta página en <b>Safari</b>.</li>'
          +'<li>Toca el botón <b>Compartir</b> <span style="display:inline-block;border:1px solid #33443a;border-radius:5px;padding:0 5px">↑</span> (abajo o arriba).</li>'
          +'<li>Elige <b>“Agregar a pantalla de inicio”</b>.</li>'
          +'<li>Confirma con <b>Agregar</b>. Quedará el ícono de Green Bears.</li>'
        +'</ol>'
        +'<div style="padding:12px 18px 16px;display:flex;justify-content:space-between;gap:8px">'
          +'<button id="pgHide" style="background:none;border:1px solid #33443a;color:#8aa;border-radius:10px;padding:9px 14px;cursor:pointer">No mostrar</button>'
          +'<button id="pgOk" style="background:#1f9b57;border:0;color:#fff;font-weight:700;border-radius:10px;padding:9px 18px;cursor:pointer">Entendido</button>'
        +'</div></div>';
      document.body.appendChild(ov);
      ov.querySelector('#pgX').onclick=function(){ ov.remove(); };
      ov.querySelector('#pgOk').onclick=function(){ ov.remove(); };
      ov.querySelector('#pgHide').onclick=function(){ dismissed=true; try{ localStorage.setItem('pizarra.installHide','1'); }catch(e){} hide(); ov.remove(); };
    }
  })();
})();
</script>
