<meta charset="utf-8">
<title>Green Bears · Pizarra</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Green Bears">
<meta name="theme-color" content="#0f1218">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
  /* ===== Consola courtside — tema oscuro comprometido, colores explícitos ===== */
  :root{
    --bg:#0f1218; --bg2:#141a23; --panel:#1a212c; --panel2:#212a37;
    --line:#2c3644; --line2:#3a4757;
    --ink:#eef2f8; --muted:#9aa6b6; --faint:#69748699;
    --amber:#f0982a; --amber-dim:#a9701f;
    --team-a:#2f74e0; --team-a-d:#1f4f9c;
    --team-b:#e0453f; --team-b-d:#9c2b27;
    --wood:#cf9a5c; --wood-d:#b7823f; --court-line:#f4ece0;
    --paint-green:#14492e; --apron:#0f3a24; --team-green:#1f9b57;
    --good:#37b26b; --chalk:#f5f2ea;
    --r:12px; --r-s:8px;
    --tap:44px;
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:15px; line-height:1.4;
    overflow:hidden;
    -webkit-user-select:none; user-select:none;
    touch-action:manipulation;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.cond{font-family:"Barlow Condensed","Barlow",sans-serif;letter-spacing:.02em}
  button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
  input,textarea,select{font-family:inherit;color:inherit}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}

  /* ===== Layout ===== */
  .app{display:flex;flex-direction:column;height:100%;padding-top:var(--safe-t)}
  .topbar{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:8px 12px;background:linear-gradient(180deg,var(--bg2),var(--bg));
    border-bottom:1px solid var(--line);min-height:52px;
  }
  .brand{display:flex;align-items:center;gap:9px;margin-right:4px}
  .brand .mark{
    width:38px;height:38px;border-radius:50%;flex:none;overflow:hidden;position:relative;
    background:#0d1117;
    display:flex;align-items:center;justify-content:center;box-shadow:0 2px 7px #0007;
  }
  /* El logo (círculo negro dentro de un cuadro blanco) se recorta al círculo:
     así el fondo blanco de las esquinas desaparece. */
  .brand .mark img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%}
  .brand .mark svg{width:26px;height:26px}
  .brand b{font-family:"Barlow Condensed";font-weight:700;font-size:20px;letter-spacing:.03em;text-transform:uppercase}
  .brand small{color:var(--muted);font-size:11px;letter-spacing:.14em;text-transform:uppercase;display:block;margin-top:-3px}

  .seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
  .seg button{
    font-family:"Barlow Condensed";font-weight:600;text-transform:uppercase;letter-spacing:.05em;
    font-size:15px;padding:7px 16px;border-radius:7px;color:var(--muted);min-height:var(--tap)
  }
  .seg button.on{background:var(--amber);color:#1a1206;box-shadow:0 1px 0 #0004}

  .spacer{flex:1 1 auto}
  .play-select{display:flex;align-items:center;gap:6px}
  select.plays{
    background:var(--panel);border:1px solid var(--line);border-radius:9px;
    padding:8px 10px;font-size:14px;font-weight:500;max-width:200px;min-height:var(--tap)
  }
  .tbtn{
    background:var(--panel);border:1px solid var(--line);border-radius:9px;
    min-height:var(--tap);min-width:var(--tap);padding:0 12px;
    display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:14px;color:var(--ink)
  }
  .tbtn:active{background:var(--panel2)}
  .tbtn.ghost{background:transparent}
  .tbtn.warn{color:var(--team-b)}
  .tbtn svg{width:18px;height:18px}

  .main{flex:1;display:flex;min-height:0}
  /* Left rail (tools) */
  .rail{
    width:76px;flex:none;background:var(--bg2);border-right:1px solid var(--line);
    display:flex;flex-direction:column;gap:6px;padding:10px 8px;overflow-y:auto
  }
  .rail .group{display:flex;flex-direction:column;gap:6px}
  .rail .lbl{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);text-align:center;margin:4px 0 0}
  .tool{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    padding:8px 4px;border-radius:10px;background:var(--panel);border:1px solid var(--line);
    color:var(--muted);min-height:52px;font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.03em
  }
  .tool svg{width:22px;height:22px}
  .tool.on{background:var(--panel2);border-color:var(--amber);color:var(--amber)}
  .tool.on svg{color:var(--amber)}
  .hr{height:1px;background:var(--line);margin:2px 4px}

  /* Court stage */
  .stage{flex:1;min-width:0;position:relative;display:flex;align-items:center;justify-content:center;padding:14px;background:
    radial-gradient(140% 100% at 50% 0%,#182031 0%,var(--bg) 70%)}
  .court-wrap{position:relative;height:100%;width:100%;display:flex;align-items:center;justify-content:center}
  svg.court{max-height:100%;max-width:100%;border-radius:12px;box-shadow:0 18px 50px -12px #000a, 0 0 0 1px #0006;touch-action:none;display:block}
  .court text{pointer-events:none}
  .token{cursor:grab}
  .token:active{cursor:grabbing}
  .token .disc{filter:drop-shadow(0 2px 3px #0007)}
  .token text{font-family:"Barlow Condensed";font-weight:700;fill:#fff}

  /* Right panel */
  .side{
    width:300px;flex:none;background:var(--bg2);border-left:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0
  }
  .side h3{margin:0;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .side .sec{padding:12px 14px;border-bottom:1px solid var(--line)}
  .steps-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .steps{display:flex;flex-direction:column;gap:7px;overflow-y:auto;flex:1;padding:12px 14px}
  .step{
    display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;
    background:var(--panel);border:1px solid var(--line)
  }
  .step.on{border-color:var(--amber);background:var(--panel2)}
  .step .n{
    width:26px;height:26px;flex:none;border-radius:7px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-family:"Barlow Condensed";font-weight:700;font-size:15px;color:var(--amber)
  }
  .step.on .n{background:var(--amber);color:#1a1206}
  .step .t{flex:1;min-width:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .step .x{color:var(--faint);padding:4px;font-size:16px;line-height:1}
  .notebox{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:9px 11px;font-size:14px;resize:none;min-height:64px;color:var(--ink)}
  .notebox:focus{outline:none;border-color:var(--amber)}
  .side .lbl2{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
  .rowbtns{display:flex;gap:8px;flex-wrap:wrap}
  .mini{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 12px;
    font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;color:var(--ink);min-height:40px}
  .mini svg{width:15px;height:15px}
  .mini.pri{background:var(--amber);color:#1a1206;border-color:transparent}
  .swatches{display:flex;gap:8px;margin-top:2px}
  .sw{width:30px;height:30px;border-radius:50%;border:2px solid #0000}
  .sw.on{border-color:#fff;box-shadow:0 0 0 2px #000}

  /* Presentar bar */
  .playbar{
    position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + var(--safe-b));
    display:flex;align-items:center;gap:12px;padding:10px 16px;
    background:#0c0f14ee;border:1px solid var(--line2);border-radius:14px;
    backdrop-filter:blur(8px);box-shadow:0 10px 30px #000a;max-width:calc(100% - 28px)
  }
  .pbtn{width:42px;height:42px;border-radius:50%;background:var(--panel2);border:1px solid var(--line2);
    display:flex;align-items:center;justify-content:center}
  .pbtn svg{width:20px;height:20px}
  .pbtn.big{width:54px;height:54px;background:var(--amber);border-color:transparent}
  .pbtn.big svg{width:26px;height:26px;color:#1a1206}
  .scrub{display:flex;gap:5px;align-items:center}
  .dot{width:11px;height:11px;border-radius:50%;background:var(--line2);border:1px solid #0006}
  .dot.on{background:var(--amber)}
  .speed{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;font-weight:600}
  .speed input{width:80px;accent-color:var(--amber)}

  .note-overlay{
    position:absolute;left:50%;transform:translateX(-50%);top:calc(14px);
    max-width:min(560px,calc(100% - 28px));text-align:center;
    background:#0c0f14dd;border:1px solid var(--line2);border-radius:12px;
    padding:8px 16px;backdrop-filter:blur(6px);box-shadow:0 8px 24px #0008;
    font-size:15px;font-weight:500;line-height:1.3;pointer-events:none;opacity:0;transition:opacity .25s
  }
  .note-overlay.show{opacity:1}
  .note-overlay .kicker{display:block;font-family:"Barlow Condensed";font-weight:700;text-transform:uppercase;
    letter-spacing:.1em;font-size:12px;color:var(--amber);margin-bottom:1px}

  .hidden{display:none!important}

  /* Modal */
  .modal-bg{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
  .modal{background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:22px;width:min(420px,100%);box-shadow:0 20px 60px #000}
  .modal h2{margin:0 0 14px;font-size:22px;text-transform:uppercase;letter-spacing:.03em}
  .modal input.txt{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:16px;margin-bottom:14px}
  .modal .actions{display:flex;gap:10px;justify-content:flex-end}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
    background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:11px 18px;
    font-weight:600;box-shadow:0 8px 24px #0009;opacity:0;transition:.25s;z-index:60;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .empty{color:var(--faint);font-size:13px;text-align:center;padding:20px 10px;font-style:italic}

  /* ===== Estadísticas ===== */
  .stats{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
  .stats-top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;
    padding:12px 16px;background:var(--bg2);border-bottom:1px solid var(--line)}
  .game-meta{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .fld{display:flex;flex-direction:column;gap:3px}
  .fld span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
  .fld input{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:14px;min-width:180px;min-height:40px}
  .score{display:flex;align-items:center;gap:10px;font-family:"Barlow Condensed"}
  .score b{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
  .score #scoreUs{color:var(--team-green)} .score #scoreThem{color:var(--team-b)}
  .score .dash{color:var(--faint);font-size:24px}
  .score .lbl3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
  .game-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .them-pts{display:flex;gap:4px}
  .chip.pt{background:var(--panel);border:1px solid var(--line2);border-radius:8px;min-width:40px;min-height:40px;font-weight:700;font-size:14px;color:var(--ink)}
  .chip.pt:active{background:var(--panel2)}

  .stats-body{flex:1;display:flex;min-height:0}
  .tracker{flex:1 1 50%;min-width:0;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:10px;padding:14px;overflow-y:auto}
  .period-bar{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
  .pbtn2{font-family:inherit;font-weight:700;font-size:14px;padding:7px 14px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;position:relative}
  .pbtn2.on{background:var(--team-green);border-color:var(--team-green);color:#fff}
  .pbtn2.cur::after{content:"";position:absolute;top:4px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--amber)}
  .roster-bar{display:flex;flex-direction:column;gap:10px}
  .pchip{display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 11px;min-height:42px;font-weight:600;font-size:14px}
  .pchip .num{font-family:"Barlow Condensed";font-weight:700;color:var(--amber);min-width:16px;text-align:center}
  .pchip.on{border-color:var(--amber);background:var(--panel2);box-shadow:0 0 0 1px var(--amber) inset}
  .pchip.add{color:var(--team-green);border-style:dashed}
  .pchip .del{color:var(--faint);font-size:15px;margin-left:2px;line-height:1}
  .roster-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:11px}
  .pbox{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:5px;background:var(--panel);
    border:1px solid var(--line);border-radius:14px;padding:13px 14px 12px;cursor:pointer;text-align:left;min-height:104px}
  .pbox:hover{border-color:var(--line2)}
  .pbox:active{transform:scale(.97)}
  .pbox .pb-num{font-family:"Barlow Condensed";font-weight:700;font-size:32px;color:var(--amber);line-height:.9}
  .pbox .pb-name{display:flex;flex-direction:column;gap:1px;max-width:100%;min-width:0}
  .pbox .pb-name .l1{font-weight:700;font-size:14px;color:var(--ink);line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
  .pbox .pb-name .l2{font-weight:500;font-size:12.5px;color:var(--muted);line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
  .pbox .pb-name em{color:#f0982a;font-style:normal;font-size:10px}
  .pbox .pb-pts{position:absolute;top:11px;right:13px;font-family:"Barlow Condensed";font-weight:800;font-size:26px;color:var(--team-green);line-height:1;text-align:right}
  .pbox .pb-pts small{display:block;font-size:9px;color:var(--muted);font-weight:700;letter-spacing:.05em}
  .roster-acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
  .detail-head{display:flex;flex-direction:column;gap:5px;background:var(--panel);border:1px solid var(--amber);border-radius:12px;padding:9px 11px}
  .detail-head .back{align-self:stretch;background:var(--panel2);border:1px solid var(--line2);color:var(--ink);font-weight:800;font-size:15px;cursor:pointer;padding:10px 12px;border-radius:10px;text-align:center}
  .detail-head .back:active{transform:scale(.98)}
  .detail-head .who{display:flex;align-items:baseline;gap:8px}
  .detail-head .who .num{font-family:"Barlow Condensed";font-weight:700;font-size:22px;color:var(--amber)}
  .detail-head .who b{font-size:16px}
  .detail-head .mini{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
  .pad button{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:52px;
    font-weight:700;font-size:13px;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.05}
  .pad button small{font-size:9.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
  .pad button:active{transform:scale(.96)}
  .pad button.good{border-color:#2f7d4e;color:#7ee6a6} .pad button.good small{color:#5bbd85}
  .pad button.bad{border-color:#8a3330;color:#f0908b} .pad button.bad small{color:#c9736e}
  .pad button:disabled{opacity:.4}
  .pad-hint{font-size:12px;color:var(--faint);text-align:center}
  .undo{background:var(--panel);border:1px solid var(--line2);border-radius:10px;min-height:44px;font-weight:700;color:var(--ink)}
  .undo:disabled{opacity:.4}

  .sheet-wrap{flex:1 1 50%;min-width:0;overflow:auto;padding:14px}
  table.sheet{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
  table.sheet th,table.sheet td{padding:8px 9px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line)}
  table.sheet th{position:sticky;top:0;background:var(--bg2);color:var(--muted);font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;z-index:1}
  table.sheet td:first-child,table.sheet th:first-child{text-align:left;position:sticky;left:0;background:var(--bg);padding-left:4px}
  table.sheet th:first-child{background:var(--bg2)}
  table.sheet .pname{font-weight:600}
  table.sheet .pnum{color:var(--amber);font-family:"Barlow Condensed";font-weight:700;margin-right:6px}
  table.sheet td.pts{font-weight:800;color:var(--team-green);font-size:15px}
  table.sheet tr.tot td{border-top:2px solid var(--line2);font-weight:800;color:var(--ink);background:var(--bg2)}
  table.sheet tr.sel td{background:var(--panel2)}
  table.sheet .empty-row td{color:var(--faint);font-style:italic;text-align:center;padding:24px}

  /* Responsive / iPad portrait & phones */
  @media (max-width:1000px){
    .side{width:250px}
    .brand small{display:none}
  }
  @media (max-width:820px){
    .main{flex-direction:column}
    .rail{width:100%;flex-direction:row;height:auto;overflow-x:auto;overflow-y:hidden;border-right:none;border-bottom:1px solid var(--line);padding:8px}
    .rail .group{flex-direction:row}
    .rail .lbl,.hr{display:none}
    .tool{min-width:56px}
    .side{width:100%;flex:none;max-height:40vh;border-left:none;border-top:1px solid var(--line)}
    .side.editing{display:flex}
    .stage{padding:8px}
    #swatches{flex-direction:row!important}
    .tool{min-height:56px;justify-content:center}
    .stats-body{flex-direction:column}
    .tracker{width:100%;border-right:none;border-bottom:1px solid var(--line)}
    .pad{grid-template-columns:repeat(4,1fr)}
  }
  @media (max-width:560px){
    .brand b{font-size:17px}
    .topbar{gap:7px;padding:7px 9px}
    select.plays{max-width:120px}
  }
</style>

<script>
/* ===== Pizarra multiusuario: capa de equipos (sincroniza con el servidor) ===== */
(function(){
  var KEYS=['pizarra.basquet.v1','pizarra.logo','pizarra.roster','pizarra.game','pizarra.games'];
  var TEAM_KEY='pizarra.team';
  var cur=null; try{cur=JSON.parse(localStorage.getItem(TEAM_KEY)||'null');}catch(e){}
  try{ window.__pzTeam = cur; }catch(e){}   // el nombre/equipo actual, para la marca de arriba
  var readonly=!!(cur && cur.owned===0);   // equipo compartido que no es propio: solo lectura
  var _set=localStorage.setItem.bind(localStorage);
  var _rm=localStorage.removeItem.bind(localStorage);
  var timer=null;

  function api(p,opts){ opts=opts||{}; opts.credentials='same-origin';
    opts.headers=Object.assign({'x-pizarra':'1'},opts.headers||{});
    if(opts.body) opts.headers['content-type']='application/json';
    return fetch('/pizarra/api'+p,opts);
  }
  function payloadStr(){ var o={}; KEYS.forEach(function(k){var v=localStorage.getItem(k); if(v!=null)o[k]=v;}); return JSON.stringify(o); }
  function pushNow(){ if(!cur||readonly) return Promise.resolve(); return api('/teams/'+cur.id,{method:'PUT',body:JSON.stringify({payload:payloadStr()})}).catch(function(){}); }
  function schedule(){ if(!cur||readonly)return; clearTimeout(timer); timer=setTimeout(pushNow,900); }
  localStorage.setItem=function(k,v){ _set(k,v); if(cur&&KEYS.indexOf(k)>=0) schedule(); };
  window.addEventListener('pagehide',function(){ pushNow(); });

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function writeTeam(data,plantel,clubLogo){
    KEYS.forEach(function(k){ try{_rm(k);}catch(e){} });
    var p={}; try{ p=JSON.parse(data||'{}')||{}; }catch(e){}
    Object.keys(p).forEach(function(k){ if(KEYS.indexOf(k)>=0) _set(k,p[k]); });
    // Equipo enlazado (Green Bears): si no hay logo propio, usar el logo del club del sitio.
    if(clubLogo && !localStorage.getItem('pizarra.logo')){ _set('pizarra.logo',clubLogo); }
    if(plantel&&plantel.length){
      var r=[]; try{ r=JSON.parse(localStorage.getItem('pizarra.roster')||'[]'); }catch(e){}
      if(!r.length){ _set('pizarra.roster',JSON.stringify(plantel.map(function(pl,i){return {id:'gb'+i,name:pl.name,num:(pl.number||'')};}))); }
    }
  }

  var ov;
  function overlay(){ if(!ov){ ov=document.createElement('div');
    ov.style.cssText='position:fixed;inset:0;z-index:99999;background:rgba(8,12,10,.93);display:flex;align-items:center;justify-content:center;padding:18px;font-family:system-ui,-apple-system,Segoe UI,sans-serif';
    document.body.appendChild(ov);} return ov; }
  function close(){ if(ov){ ov.remove(); ov=null; } }

  function open(id){
    pushNow().then(function(){ return api('/teams/'+id).then(function(r){return r.json();}); }).then(function(d){
      if(!d||d.error){ alert('No se pudo abrir el equipo'); return; }
      writeTeam(d.payload,d.plantel,d.clubLogo);
      _set(TEAM_KEY,JSON.stringify({id:d.team.id,name:d.team.name,linked:d.team.linked_plantel,owned:d.team.owned,review:d.team.review||0}));
      location.reload();
    });
  }

  function showPicker(canClose){
    var o=overlay();
    o.innerHTML='<div style="background:#101613;border:1px solid #26332b;border-radius:16px;max-width:460px;width:100%;color:#eaf2ec;box-shadow:0 30px 60px -20px #000;overflow:hidden">'
      +'<div style="padding:16px 20px;border-bottom:1px solid #26332b;display:flex;align-items:center;justify-content:space-between"><b style="font-size:1.15rem">Elige tu equipo</b>'+(canClose?'<button id="pzX" style="background:none;border:0;color:#8aa;font-size:1.5rem;cursor:pointer;line-height:1">&times;</button>':'')+'</div>'
      +(!canClose?'<div style="padding:2px 20px 12px;color:#f0982a;font-size:.82rem;font-weight:600">Debes elegir o crear un equipo para continuar.</div>':'')
      +'<div id="pzList" style="padding:12px 16px;max-height:52vh;overflow:auto">Cargando…</div>'
      +'<form id="pzNew" style="display:flex;gap:8px;padding:14px 16px;border-top:1px solid #26332b;flex-wrap:wrap"><input id="pzName" placeholder="Nombre del equipo nuevo" maxlength="40" style="flex:1;min-width:150px;padding:10px 12px;border-radius:10px;border:1px solid #33443a;background:#0b100d;color:#eaf2ec"><button style="padding:10px 16px;border-radius:10px;border:0;background:#1f9b57;color:#fff;font-weight:700;cursor:pointer">Crear</button></form>'
      +'<div style="padding:0 16px 14px;text-align:center"><a href="/pizarra/logout" style="color:#7c8;font-size:.85rem">Cerrar sesión</a></div></div>';
    if(canClose) o.querySelector('#pzX').onclick=close;
    o.querySelector('#pzNew').onsubmit=function(e){ e.preventDefault(); var n=o.querySelector('#pzName').value.trim(); if(!n)return;
      api('/teams',{method:'POST',body:JSON.stringify({name:n})}).then(function(r){return r.json();}).then(function(d){ if(d.id) open(d.id); else alert(d.error||'No se pudo crear'); }); };
    api('/teams').then(function(r){ if(r.status===401){ location.href='/pizarra/login'; return null; } return r.json(); }).then(function(d){
      if(!d) return; var L=o.querySelector('#pzList');
      if(!d.teams||!d.teams.length){ L.innerHTML='<div style="color:#8aa;padding:10px 4px">Aún no tienes equipos. Crea el primero abajo.</div>'; return; }
      var isSuper=!!d.super;
      if(isSuper){ o.querySelector('#pzNew').style.display='none'; L.insertAdjacentHTML('beforebegin',''); }
      L.innerHTML=(isSuper?'<div style="color:#7cbfe0;font-size:.8rem;padding:2px 4px 8px">Superadmin: revisa cualquier equipo (solo lectura).</div>':'')
        +d.teams.map(function(t){
        var tag=t.shared?' <span style="color:#f0982a;font-size:.72rem">· compartido</span>':(t.linked_plantel?' <span style="color:#1f9b57;font-size:.72rem">· plantel del sitio</span>':'');
        var own=(isSuper&&t.owner&&!t.owned)?' <span style="color:#9fb0a5;font-size:.72rem">· coach: '+esc(t.ownerName||t.owner)+'</span>':'';
        var del=t.owned?'<span class="pzDel" data-id="'+t.id+'" style="color:#b55;font-size:1.2rem;padding:0 4px 0 10px">&times;</span>':'';
        return '<div class="pzT" data-id="'+t.id+'" style="display:flex;align-items:center;justify-content:space-between;margin:6px 0;padding:12px 14px;border-radius:12px;border:1px solid #2b3a31;background:#0c120f;cursor:pointer"><span><b>'+esc(t.name)+'</b>'+tag+own+'</span>'+del+'</div>'; }).join('');
      [].forEach.call(L.querySelectorAll('.pzT'),function(b){ b.onclick=function(ev){ if(ev.target.classList.contains('pzDel'))return; open(b.getAttribute('data-id')); }; });
      [].forEach.call(L.querySelectorAll('.pzDel'),function(x){ x.onclick=function(ev){ ev.stopPropagation(); if(confirm('¿Eliminar este equipo y todas sus jugadas?')){ api('/teams/'+x.getAttribute('data-id'),{method:'DELETE'}).then(function(){ showPicker(canClose); }); } }; });
    }).catch(function(){ o.querySelector('#pzList').innerHTML='<div style="color:#c66;padding:8px 4px">Sin conexión con el servidor.</div>'; });
  }

  function floatBtn(){ var b=document.createElement('button'); b.textContent='⇄ '+(cur?cur.name:'Equipo')+(readonly?' · solo lectura':'');
    b.style.cssText='position:fixed;left:10px;bottom:10px;z-index:9000;background:'+(readonly?'#3a2a12':'#101613')+';color:#eaf2ec;border:1px solid '+(readonly?'#6b4e1e':'#2b3a31')+';border-radius:999px;padding:8px 14px;font-size:.82rem;font-weight:700;cursor:pointer;box-shadow:0 8px 20px -8px #000;font-family:system-ui,sans-serif';
    b.onclick=function(){ showPicker(true); }; document.body.appendChild(b); }
  function roBanner(){ var d=document.createElement('div');
    d.textContent = (cur&&cur.review)
      ? ('Revisando “'+(cur?cur.name:'')+'” como superadmin · solo lectura — no se guardan cambios.')
      : 'Green Bears · solo lectura — las jugadas solo se editan con la cuenta “greenbears”.';
    d.style.cssText='position:fixed;top:0;left:0;right:0;z-index:9200;background:#f0982a;color:#221a08;font:600 .8rem system-ui,sans-serif;text-align:center;padding:6px 10px';
    document.body.appendChild(d); document.body.style.paddingTop='28px'; }

  function init(){ if(!cur||!cur.id){ readonly=false; showPicker(false); } else { floatBtn(); if(readonly) roBanner(); } }
  if(document.body) init(); else document.addEventListener('DOMContentLoaded',init);
})();
</script>

<script>
"use strict";
(function(){
  /* ============================================================
     Modelo:  playbook = [ play ]
     play = { id, name, court:'half'|'full', tokens:[def], frames:[frame] }
     token def (identidad, no posición): { id, team:'a'|'b'|'ball', num }
     frame = { pos:{ tokenId:{x,y(0..1)} }, arrows:[arrow], note:'' }
     arrow = { type:'cut'|'pass'|'dribble'|'screen'|'pen', pts:[{x,y}], color }
     x,y son fracciones 0..1 del viewBox de la cancha (independiente del tamaño).
  ============================================================ */
  const VB = {half:{w:500,h:470}, full:{w:500,h:940}};
  const LS_KEY = 'pizarra.basquet.v1';
  const LOGO_KEY = 'pizarra.logo';   // logo del equipo (dataURL) subido desde el dispositivo
  const LIBV_KEY = 'pizarra.libv';   // versión de la biblioteca ya fusionada en el dispositivo
  const LIB_VER  = 3;                 // súbelo al agregar sistemas nuevos: se auto-completan

  const COLORS = ['#f5f2ea','#f0982a','#2f74e0','#e0453f','#37b26b'];

  const TOOLS = [
    {id:'move',   name:'Mover',   icon:'M5 9 2 12l3 3M9 5 12 2l3 3M15 19l-3 3-3-3M19 9l3 3-3 3M12 2v20M2 12h20'},
    {id:'cut',    name:'Corte',   icon:'ARR-solid'},
    {id:'pass',   name:'Pase',    icon:'ARR-dash'},
    {id:'dribble',name:'Bote',    icon:'ARR-wave'},
    {id:'screen', name:'Bloqueo', icon:'ARR-screen'},
    {id:'pen',    name:'Lápiz',   icon:'M3 21l3.5-.9L20 6.6a2 2 0 0 0-2.8-2.8L3.9 17.5 3 21ZM15 6l3 3'},
    {id:'erase',  name:'Borrar',  icon:'M16 3 3 16l5 5h5l8-8-5-5ZM6 13l5 5'}
  ];

  // Constantes de color y id único (definidos antes de load() para evitar TDZ)
  const CH='#f5f2ea', AM='#f0982a';   // tiza / balón
  let _uidn=0;
  function uid(){ return 'id'+Date.now().toString(36)+(_uidn++).toString(36)+Math.floor(Math.random()*1e6).toString(36); }

  // ---------- estado ----------
  let book = load();
  let curId = book.length ? book[0].id : null;
  let mode = 'edit';           // 'edit' | 'present'
  let tool = 'move';
  let inkColor = COLORS[0];
  let curFrame = 0;            // índice de paso seleccionado / mostrado
  let anim = null;            // estado de reproducción

  // ---------- refs ----------
  const $ = s=>document.querySelector(s);
  const court = $('#court');
  const playSelect = $('#playSelect');
  const stepList = $('#stepList');
  const noteInput = $('#noteInput');
  const toastEl = $('#toast');

  // ============================================================
  //  Persistencia
  // ============================================================
  function load(){
    try{
      const raw = localStorage.getItem(LS_KEY);
      if(raw){ const d = JSON.parse(raw); if(Array.isArray(d)&&d.length) return d; }
    }catch(e){}
    return libraryPlays();
  }
  function save(){
    if(mode==='quick') return;   // el modo rápido es efímero, no se guarda
    try{ localStorage.setItem(LS_KEY, JSON.stringify(book)); }catch(e){}
  }
  // Completa la biblioteca en dispositivos que guardaron una versión vieja:
  // agrega los sistemas que falten (por nombre) sin borrar las jugadas propias.
  function ensureLibrary(force){
    let ver=0; try{ ver=parseInt(localStorage.getItem(LIBV_KEY)||'0',10)||0; }catch(e){}
    if(!force && ver>=LIB_VER) return 0;
    const names=new Set(book.map(p=>p.name));
    let added=0;
    libraryPlays().forEach(p=>{ if(!names.has(p.name)){ book.push(p); added++; } });
    try{ localStorage.setItem(LIBV_KEY,String(LIB_VER)); }catch(e){}
    if(added) save();
    return added;
  }
  // ---------- Modo rápido (pizarra en vivo, no se guarda) ----------
  let quick=null;
  function newQuick(){ return { id:'__quick', name:'Rápido', court:'half',
    tokens:baseTokens(), frames:[{pos:{}, arrows:[]}],
    seq:['a1','a2','a3','a4','a5','ball','b1','b2','b3','b4','b5'] }; }
  function play(){ if(mode==='quick'){ if(!quick) quick=newQuick(); return quick; } return book.find(p=>p.id===curId); }
  function frame(){ return mode==='quick' ? play().frames[0] : play().frames[curFrame]; }


  // ---------- jugada base ----------
  function baseTokens(){
    return [
      {id:'a1',team:'a',num:'1'},{id:'a2',team:'a',num:'2'},{id:'a3',team:'a',num:'3'},
      {id:'a4',team:'a',num:'4'},{id:'a5',team:'a',num:'5'},
      {id:'b1',team:'b',num:'1'},{id:'b2',team:'b',num:'2'},{id:'b3',team:'b',num:'3'},
      {id:'b4',team:'b',num:'4'},{id:'b5',team:'b',num:'5'},
      {id:'ball',team:'ball',num:''}
    ];
  }
  function startPos(){
    return {
      a1:{x:.50,y:.66}, a2:{x:.18,y:.52}, a3:{x:.82,y:.52}, a4:{x:.30,y:.30}, a5:{x:.70,y:.30},
      b1:{x:.50,y:.54}, b2:{x:.26,y:.44}, b3:{x:.74,y:.44}, b4:{x:.38,y:.26}, b5:{x:.62,y:.26},
      ball:{x:.545,y:.64}
    };
  }
  function newPlay(name){
    return { id:uid(), name:name||'Jugada nueva', court:'half',
      tokens:baseTokens(),
      frames:[ {pos:startPos(), arrows:[], note:'Formación inicial.'} ] };
  }
  function clonePos(pos){ const o={}; for(const k in pos) o[k]={x:pos[k].x,y:pos[k].y}; return o; }

  // ---------- Logo del equipo (subido desde el dispositivo) ----------
  function teamLogo(){ try{ return localStorage.getItem(LOGO_KEY) || ''; }catch(e){ return ''; } }
  function hasTeamLogo(){ try{ return !!localStorage.getItem(LOGO_KEY); }catch(e){ return false; } }
  function applyBrandLogo(){
    // Nombre del equipo actual (viene de la capa de equipos) en la marca de arriba.
    try{
      const t=window.__pzTeam;
      const nb=document.querySelector('.brand b'), ns=document.querySelector('.brand small');
      if(nb) nb.textContent = (t&&t.name) ? t.name : 'Equipo';
      if(ns) ns.textContent = 'Pizarra táctica';
    }catch(e){}
    const img=document.getElementById('brandLogo'), paw=document.getElementById('brandPaw');
    if(!img) return;
    const src=teamLogo();
    if(!src){ img.style.display='none'; if(paw) paw.style.display=''; return; }  // sin logo cargado → patita
    img.onload=()=>{ if(paw) paw.style.display='none'; };
    img.onerror=()=>{ img.style.display='none'; if(paw) paw.style.display=''; };
    img.style.display=''; img.src=src;
  }
  function pickTeamLogo(){
    const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
    inp.onchange=()=>{ const f=inp.files[0]; if(!f) return;
      const rd=new FileReader();
      rd.onload=()=>{ const im=new Image();
        im.onload=()=>{
          // Reescalar a máx. 320px para no llenar el almacenamiento local.
          const max=320; let w=im.width,h=im.height; const s=Math.min(1,max/Math.max(w,h));
          w=Math.max(1,Math.round(w*s)); h=Math.max(1,Math.round(h*s));
          const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
          cv.getContext('2d').drawImage(im,0,0,w,h);
          let data; try{ data=cv.toDataURL('image/png'); }catch(e){ data=rd.result; }
          try{ localStorage.setItem(LOGO_KEY,data); }catch(e){ toast('La imagen es muy grande'); return; }
          applyBrandLogo(); buildCourt(); toast('Logo del equipo actualizado');
        };
        im.onerror=()=>toast('No se pudo leer la imagen');
        im.src=rd.result;
      };
      rd.readAsDataURL(f);
    };

  // ---------- Biblioteca de jugadas y sistemas precargados ----------
  // Constructor compacto: roster = fichas usadas; steps = [{set|move, arrows, note}].
  //   set/move: { tokenId:[x,y] }   (fracciones 0..1 de la cancha; aro arriba)
  //   arrows:   [ [tipo, x0,y0, x1,y1, color?] ]  tipos: cut|pass|dribble|screen|pen
  // 'move' hereda las posiciones del paso anterior (solo defines quién se mueve).
  function buildLibPlay(name, roster, steps, court){
    const tokens = baseTokens().filter(t=>roster.indexOf(t.id)>=0);
    let cur={};
    const frames = steps.map(s=>{
      if(s.set){ cur={}; for(const k in s.set) cur[k]={x:s.set[k][0],y:s.set[k][1]}; }
      if(s.move){ for(const k in s.move) cur[k]={x:s.move[k][0],y:s.move[k][1]}; }
      const pos={}; for(const k in cur) pos[k]={x:cur[k].x,y:cur[k].y};
      const arrows=(s.arrows||[]).map(a=>({type:a[0], color:a[5]||CH, pts:[{x:a[1],y:a[2]},{x:a[3],y:a[4]}]}));
      return {pos, arrows, note:s.note||''};
    });
    return { id:uid(), name, court:court||'half', tokens, frames };
  }

      {move:{ball:[.08,.22]},
       arrows:[['pass',.36,.30,.08,.22,AM]],
       note:'El 4 mantiene abierta la esquina: kick-out para el triple de esquina, el tiro más valioso del sistema.'}
    ]));

    return P;
  }

  // ============================================================
  //  Dibujo de la cancha (parquet + líneas)
  // ============================================================
  function polyArc(cx,cy,r,a0,a1,steps){
    let s=''; for(let i=0;i<=steps;i++){ const a=a0+(a1-a0)*i/steps; const x=cx+r*Math.cos(a), y=cy+r*Math.sin(a); s+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)+' '; } return s;
  }
  function arcPath(cx,cy,r,a0,a1){ return polyArc(cx,cy,r,a0,a1,36); }

  // PRNG determinista (para que el veteado no parpadee al redibujar)
  function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
  // Parquet realista: rejilla de paneles con tablones alternando dirección (basketweave)
  function woodPattern(x0,y0,ww,hh){
    const rnd=mulberry32(1337);
    const cols=6, panel=ww/cols, rows=Math.ceil(hh/panel), nP=6;
    let s='';
    for(let j=0;j<rows;j++) for(let i=0;i<cols;i++){
      const px=x0+i*panel, py=y0+j*panel;
      const pw=panel, ph=Math.min(panel, y0+hh-py);
      if(ph<=0.5) continue;
      const horiz=((i+j)&1)===0;
      for(let k=0;k<nP;k++){
        const Lp=(45+rnd()*15).toFixed(0), Hh=(30+rnd()*7).toFixed(0);
        const shade=`hsl(${Hh} 46% ${Lp}%)`;
        const grain=`hsl(28 40% ${(Number(Lp)-14)}%)`;
        if(horiz){
          const plh=ph/nP, yy=py+k*plh;
          s+=`<rect x="${px.toFixed(1)}" y="${yy.toFixed(1)}" width="${(pw+0.5).toFixed(1)}" height="${(plh+0.6).toFixed(1)}" fill="${shade}"/>`;
          s+=`<line x1="${(px+2).toFixed(1)}" y1="${(yy+plh*0.5).toFixed(1)}" x2="${(px+pw-2).toFixed(1)}" y2="${(yy+plh*0.5).toFixed(1)}" stroke="${grain}" stroke-width="0.5" opacity="0.25"/>`;
        }else{
          const plw=pw/nP, xx=px+k*plw;
          s+=`<rect x="${xx.toFixed(1)}" y="${py.toFixed(1)}" width="${(plw+0.6).toFixed(1)}" height="${(ph+0.5).toFixed(1)}" fill="${shade}"/>`;
          s+=`<line x1="${(xx+plw*0.5).toFixed(1)}" y1="${(py+2).toFixed(1)}" x2="${(xx+plw*0.5).toFixed(1)}" y2="${(py+ph-2).toFixed(1)}" stroke="${grain}" stroke-width="0.5" opacity="0.25"/>`;
        }
      }
      // costura del panel
      s+=`<rect x="${px.toFixed(1)}" y="${py.toFixed(1)}" width="${pw.toFixed(1)}" height="${ph.toFixed(1)}" fill="none" stroke="#5a3c20" stroke-width="0.7" opacity="0.4"/>`;
    }
    return s;
  }

  // marcas de media cancha con aro arriba, dentro de w x hh, con desplazamiento oy y flip
  function halfMarks(w,hh,oy,flip){
    const L='var(--court-line)', GREEN='var(--paint-green)', sw=2.4;
    const cx=w/2;
    const map=y=> flip ? (oy + hh - y) : (oy + y);   // y desde la línea de fondo
    const P=(x,y)=>x.toFixed(1)+' '+map(y).toFixed(1);
    const margin=15, hoopY=54, rim=7.5, bbY=41, bbW=62;
    const paintW=150, paintTop=15, paintBot=205, ftR=58;
    const tpR=225, tpX=42, tpMeetY= hoopY + Math.sqrt(tpR*tpR-(cx-tpX)*(cx-tpX));
    let g='';

    // === Relleno VERDE de la zona (pintura / llave) ===
    g+=`<path d="M${P(cx-paintW/2,paintTop)} L${P(cx-paintW/2,paintBot)} L${P(cx+paintW/2,paintBot)} L${P(cx+paintW/2,paintTop)} Z" fill="${GREEN}"/>`;
    // brillo sutil de barniz sobre la pintura
    g+=`<path d="M${P(cx-paintW/2,paintTop)} L${P(cx-paintW/2,paintBot)} L${P(cx+paintW/2,paintBot)} L${P(cx+paintW/2,paintTop)} Z" fill="url(#paintGloss)"/>`;

    // === Líneas blancas ===
    g+=`<g fill="none" stroke="${L}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round">`;
    g+=`<path d="M${P(margin,margin)} L${P(w-margin,margin)}"/>`;          // fondo
    g+=`<path d="M${P(margin,margin)} L${P(margin,hh-1)}"/>`;              // lateral izq
    g+=`<path d="M${P(w-margin,margin)} L${P(w-margin,hh-1)}"/>`;          // lateral der
    g+=`<path d="M${P(cx-paintW/2,paintTop)} L${P(cx-paintW/2,paintBot)} L${P(cx+paintW/2,paintBot)} L${P(cx+paintW/2,paintTop)} Z"/>`; // llave
    // marcas de rebote en la llave
    [58,86,114,150].forEach(yy=>{
      g+=`<path d="M${P(cx-paintW/2-5,yy)} L${P(cx-paintW/2,yy)}"/>`;
      g+=`<path d="M${P(cx+paintW/2,yy)} L${P(cx+paintW/2+5,yy)}"/>`;
    });
    // círculo de tiros libres: sólido fuera de la llave, punteado dentro
    g+=`<path d="${arcPath(cx,map(paintBot),ftR,flip? -Math.PI:0, flip? -2*Math.PI:Math.PI)}"/>`;
    g+=`<path stroke-dasharray="7 7" d="${arcPath(cx,map(paintBot),ftR,flip?0:Math.PI, flip?Math.PI:2*Math.PI)}"/>`;
    // arco de zona restringida bajo el aro
    g+=`<path d="${arcPath(cx,map(hoopY),40,flip?-Math.PI:0,flip?-2*Math.PI:Math.PI)}"/>`;
    // línea de triple: rectas + arco
    const yMeet=map(tpMeetY);
    g+=`<path d="M${P(tpX,margin)} L${tpX.toFixed(1)} ${yMeet.toFixed(1)}"/>`;
    g+=`<path d="M${P(w-tpX,margin)} L${(w-tpX).toFixed(1)} ${yMeet.toFixed(1)}"/>`;
    const aR=Math.atan2((flip?-1:1)*(tpMeetY-hoopY),(w-tpX)-cx);
    const aL=Math.atan2((flip?-1:1)*(tpMeetY-hoopY),(tpX)-cx);
    g+=`<path d="${polyArc(cx,map(hoopY),tpR,aR,aL,44)}"/>`;
    g+=`</g>`;

    // === Aro + tablero realistas ===
    const bY=map(bbY), hY=map(hoopY);
    // soporte tablero → aro
    g+=`<line x1="${cx}" y1="${bY}" x2="${cx}" y2="${hY}" stroke="#2b2b30" stroke-width="3.4"/>`;
    // tablero: sombra + cuerpo oscuro + cara blanca + cuadro de tiro
    g+=`<line x1="${cx-bbW/2}" y1="${bY}" x2="${cx+bbW/2}" y2="${bY}" stroke="#000" stroke-width="8" stroke-linecap="round" opacity="0.35"/>`;
    g+=`<line x1="${cx-bbW/2}" y1="${bY}" x2="${cx+bbW/2}" y2="${bY}" stroke="#101014" stroke-width="6.5" stroke-linecap="round"/>`;
    g+=`<line x1="${cx-bbW/2}" y1="${bY}" x2="${cx+bbW/2}" y2="${bY}" stroke="#f4f4f0" stroke-width="3" stroke-linecap="round"/>`;
    g+=`<rect x="${cx-9}" y="${bY-2.4}" width="18" height="4.8" fill="none" stroke="#e8801f" stroke-width="1.6"/>`;
    // aro naranjo con red
    g+=`<circle cx="${cx}" cy="${hY}" r="${rim+1.4}" fill="none" stroke="#00000055" stroke-width="1.5"/>`;
    g+=`<circle cx="${cx}" cy="${hY}" r="${rim}" fill="#e8801f22" stroke="#ec8a25" stroke-width="3.4"/>`;
    g+=`<circle cx="${cx}" cy="${hY}" r="${rim-1.8}" fill="none" stroke="#ffc072" stroke-width="1"/>`;
    // red (líneas cruzadas dentro del aro)
    let net='<g stroke="#f2f2ee" stroke-width="0.7" opacity="0.55" fill="none">';
    for(let k=0;k<8;k++){ const a=k/8*2*Math.PI, a2=(k+1)/8*2*Math.PI;
      net+=`<path d="M${(cx+rim*Math.cos(a)).toFixed(1)} ${(hY+rim*Math.sin(a)).toFixed(1)} L${(cx+(rim-3)*Math.cos(a2)).toFixed(1)} ${(hY+(rim-3)*Math.sin(a2)).toFixed(1)}"/>`;
    }
    net+='</g>'; g+=net;
    return g;
  }

  function buildCourt(){
    const p=play(); const type=p.court; const {w,h}=VB[type];
    court.setAttribute('viewBox',`0 0 ${w} ${h}`);
    const A=15;                                   // apron / fuera de límites
    const woodX=A, woodY=A, woodW=w-2*A;
    const woodH = type==='full' ? h-2*A : h-A;    // media cancha: sin apron abajo (es el centro)
    const planks = woodPattern(woodX,woodY,woodW,woodH);

    let marks='';
    if(type==='half'){
      marks = halfMarks(w,h,0,false);
      marks+=`<g fill="none" stroke="var(--court-line)" stroke-width="2.4"><path d="M15 ${h-1} L${w-15} ${h-1}"/><path d="${polyArc(w/2,h,58,Math.PI,2*Math.PI,28)}"/></g>`;
    }else{
      marks = halfMarks(w,h/2,0,false) + halfMarks(w,h/2,h/2,true);
      marks+=`<g fill="none" stroke="var(--court-line)" stroke-width="2.4"><path d="M15 ${h/2} L${w-15} ${h/2}"/><circle cx="${w/2}" cy="${h/2}" r="58"/><circle cx="${w/2}" cy="${h/2}" r="4" fill="var(--court-line)"/></g>`;
    }
    // logo del equipo al centro (marca de agua), recortado en círculo para
    // eliminar el fondo blanco de las esquinas del logo.
    const logoR=46;
    // Cancha completa: al centro. Media cancha: en una esquina (abajo a la derecha).
    const logoX = type==='full' ? w/2 : (w-logoR-20);
    const logoY = type==='full' ? h/2 : (h-logoR-20);
    const _logo = teamLogo();
    const centerLogo = _logo ? `<g opacity="0.45" id="gCenterLogo"><image href="${_logo}" x="${logoX-logoR}" y="${logoY-logoR}" width="${logoR*2}" height="${logoR*2}" preserveAspectRatio="xMidYMid slice" clip-path="url(#logoClip)"/></g>` : '';

    court.innerHTML = `
      <defs>
        <radialGradient id="vign" cx="50%" cy="16%" r="95%">
          <stop offset="55%" stop-color="#000" stop-opacity="0"/>
          <stop offset="100%" stop-color="#000" stop-opacity="0.30"/>
        </radialGradient>
        <linearGradient id="paintGloss" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#fff" stop-opacity="0.10"/>
          <stop offset="45%" stop-color="#fff" stop-opacity="0"/>
          <stop offset="100%" stop-color="#000" stop-opacity="0.12"/>
        </linearGradient>
        <clipPath id="woodClip"><rect x="${woodX}" y="${woodY}" width="${woodW}" height="${woodH}"/></clipPath>
        <clipPath id="logoClip"><circle cx="${logoX}" cy="${logoY}" r="${logoR-1}"/></clipPath>
      </defs>
      <rect x="0" y="0" width="${w}" height="${h}" fill="var(--apron)"/>
      <g clip-path="url(#woodClip)"><g id="gPlanks">${planks}</g>
        <rect x="${woodX}" y="${woodY}" width="${woodW}" height="${woodH}" fill="url(#vign)"/></g>
      ${centerLogo}
      <g id="gMarks">${marks}</g>
      <g id="gArrows"></g>
      <g id="gTokens"></g>`;
    // si no hay logo.png, ocultar la marca de agua
    const limg = court.querySelector('#gCenterLogo image');
    if(limg) limg.addEventListener('error',()=>{ const gl=court.querySelector('#gCenterLogo'); if(gl) gl.remove(); });
    render();
  }

  // ============================================================
  //  Render fichas + flechas del frame actual (o interpolado)
  // ============================================================
  function tokenColors(t){
    if(t==='a') return ['var(--team-a)','var(--team-a-d)'];
    if(t==='b') return ['var(--team-b)','var(--team-b-d)'];
    return ['var(--amber)','var(--amber-dim)'];
  }
  function render(posOverride, arrowsOverride){
    const p=play(); const {w,h}=VB[p.court];
    const pos = posOverride || frame().pos;
    const arrows = arrowsOverride!==undefined ? arrowsOverride : frame().arrows;
    const R = p.court==='full'? 14 : 17;

    // flechas
    let ax='';
    arrows.forEach(a=> ax+=arrowSVG(a,w,h));
    court.querySelector('#gArrows').innerHTML = ax;

    // fichas
    let tx='';
    p.tokens.forEach(t=>{
      const pt = pos[t.id]; if(!pt) return;
      const cx=pt.x*w, cy=pt.y*h;
      const [c1,c2]=tokenColors(t.team);
      if(t.team==='ball'){
        tx+=`<g class="token" data-id="${t.id}">
          <circle class="disc" cx="${cx}" cy="${cy}" r="${R*0.62}" fill="${c1}" stroke="#7a4d12" stroke-width="1.5"/>
          <path d="M${cx-R*0.62} ${cy} h${R*1.24} M${cx} ${cy-R*0.62} v${R*1.24} M${cx-R*0.44} ${cy-R*0.44} A${R*0.62} ${R*0.62} 0 0 1 ${cx+R*0.44} ${cy-R*0.44} M${cx-R*0.44} ${cy+R*0.44} A${R*0.62} ${R*0.62} 0 0 0 ${cx+R*0.44} ${cy+R*0.44}" stroke="#7a4d12" stroke-width="1.2" fill="none"/>
        </g>`;
      }else{
        tx+=`<g class="token" data-id="${t.id}">
          <circle class="disc" cx="${cx}" cy="${cy}" r="${R}" fill="${c1}" stroke="${c2}" stroke-width="2.5"/>
          <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#ffffff30" stroke-width="1"/>
          <text x="${cx}" y="${cy+R*0.34}" font-size="${R*1.15}" text-anchor="middle">${t.num}</text>
        </g>`;
      }
    });
    court.querySelector('#gTokens').innerHTML = tx;
  }

  // ---------- generar SVG de una flecha ----------
  function arrowSVG(a,w,h){
    const pts=a.pts.map(p=>({x:p.x*w,y:p.y*h}));
    if(pts.length<2) return '';
    const col=a.color||'#f5f2ea';
    const sw = 3.2;
    let path='', head='', extra='';
    const p0=pts[0], p1=pts[pts.length-1];
    const pen2=pts[pts.length-2]||p0;                 // penúltimo punto: dirección real de la punta
    const ang=Math.atan2(p1.y-pen2.y, p1.x-pen2.x);

    if(a.type==='pen'){
      path=`M${pts.map(p=>p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' L')}`;
      return `<path d="${path}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>`;
    }
    if(a.type==='dribble'){
      path = pts.length>2 ? wavyAlong(pts,7,15) : wavy(p0,p1,7,15);
    }else if(a.type==='cut'){
      path = 'M'+pts.map(p=>p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' L');   // corte: sigue el trazo
    }else{
      path=`M${p0.x.toFixed(1)} ${p0.y.toFixed(1)} L${p1.x.toFixed(1)} ${p1.y.toFixed(1)}`;
    }
    const dash = a.type==='pass' ? 'stroke-dasharray="9 8"' : '';
    let body=`<path d="${path}" fill="none" stroke="${col}" stroke-width="${sw}" ${dash} stroke-linecap="round" stroke-linejoin="round"/>`;

    if(a.type==='screen'){
      // barra perpendicular al final (bloqueo)
      const bl=12;
      const bx=Math.cos(ang+Math.PI/2)*bl, by=Math.sin(ang+Math.PI/2)*bl;
      extra=`<path d="M${(p1.x-bx).toFixed(1)} ${(p1.y-by).toFixed(1)} L${(p1.x+bx).toFixed(1)} ${(p1.y+by).toFixed(1)}" stroke="${col}" stroke-width="${sw}" stroke-linecap="round"/>`;
    }else{
      // punta de flecha
      const hl=13, ha=0.42;
      const hx1=p1.x-hl*Math.cos(ang-ha), hy1=p1.y-hl*Math.sin(ang-ha);
      const hx2=p1.x-hl*Math.cos(ang+ha), hy2=p1.y-hl*Math.sin(ang+ha);
      head=`<path d="M${p1.x.toFixed(1)} ${p1.y.toFixed(1)} L${hx1.toFixed(1)} ${hy1.toFixed(1)} M${p1.x.toFixed(1)} ${p1.y.toFixed(1)} L${hx2.toFixed(1)} ${hy2.toFixed(1)}" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" fill="none"/>`;
    }
    return `<g opacity="0.96">${body}${head}${extra}</g>`;
  }
  function wavy(p0,p1,amp,wl){
    const dx=p1.x-p0.x, dy=p1.y-p0.y, len=Math.hypot(dx,dy);
    const ux=dx/len, uy=dy/len, nx=-uy, ny=ux;
    const n=Math.max(6,Math.round(len/wl)*2);
    let d='M'+p0.x.toFixed(1)+' '+p0.y.toFixed(1);
    for(let i=1;i<=n;i++){
      const t=i/n, off=Math.sin(t*Math.PI* (len/wl))*amp*(i<n?1: .3);
      const x=p0.x+dx*t+nx*off, y=p0.y+dy*t+ny*off;
      d+=' L'+x.toFixed(1)+' '+y.toFixed(1);
    }
    return d;
  }
  // Onda que sigue una polilínea libre (bote con trazo curvo).
  function wavyAlong(pts,amp,wl){
    if(pts.length<2) return '';
    let acc=0; const out=[];
    for(let i=1;i<pts.length;i++){
      const a=pts[i-1], b=pts[i];
      const dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy)||0.0001;
      const ux=dx/len, uy=dy/len, nx=-uy, ny=ux;
      const steps=Math.max(1,Math.round(len/3));
      for(let s=0;s<steps;s++){
        const t=s/steps, px=a.x+dx*t, py=a.y+dy*t, dist=acc+len*t;
        const off=Math.sin(dist/wl*Math.PI*2)*amp;
        out.push((px+nx*off).toFixed(1)+' '+(py+ny*off).toFixed(1));
      }
      acc+=len;
    }
    const last=pts[pts.length-1]; out.push(last.x.toFixed(1)+' '+last.y.toFixed(1)); // termina limpio en la punta
    return 'M'+out.join(' L');
  }

  // ============================================================
  //  Interacción en la cancha (arrastrar fichas / dibujar flechas)
  // ============================================================
  let drag=null, drawing=null;

  function svgPoint(ev){
    const r=court.getBoundingClientRect();
    const vb=court.viewBox.baseVal;
    const x=(ev.clientX-r.left)/r.width*vb.width;
    const y=(ev.clientY-r.top)/r.height*vb.height;
    return {x,y, fx:x/vb.width, fy:y/vb.height};
  }

  function quickPlaceNext(sp){
    const pos=frame().pos, seq=play().seq||[];
    const next=seq.find(id=>!pos[id]);
    if(!next){ toast('Ya están las 11 fichas — arrástralas'); return; }
    pos[next]={x:clamp(sp.fx),y:clamp(sp.fy)};
    render();
  }
  court.addEventListener('pointerdown',e=>{
    if(mode!=='edit' && mode!=='quick') return;
    court.setPointerCapture(e.pointerId);
    const g=e.target.closest('.token');
    if(tool==='move'){
      if(g){ drag={id:g.dataset.id}; }
      else if(mode==='quick'){ quickPlaceNext(svgPoint(e)); }
      return;
    }
    if(tool==='erase'){
      eraseAt(svgPoint(e)); return;
    }
    // herramienta de dibujo
    const sp=svgPoint(e);
    drawing={type:tool, color:inkColor, pts:[{x:sp.fx,y:sp.fy}]};
  });

  court.addEventListener('pointermove',e=>{
    if(mode!=='edit' && mode!=='quick') return;
    const sp=svgPoint(e);
    if(drag){
      frame().pos[drag.id]={x:clamp(sp.fx),y:clamp(sp.fy)};
      render();
      return;
    }
    if(drawing){
      // Corte, Bote y Lápiz siguen el trazo libre; Pase y Bloqueo van rectos.
      if(drawing.type==='pen'||drawing.type==='cut'||drawing.type==='dribble'){ drawing.pts.push({x:sp.fx,y:sp.fy}); }
      else{ drawing.pts[1]={x:sp.fx,y:sp.fy}; }
      // preview
      render(undefined, frame().arrows.concat([drawing]));
    }
  });

  function endDraw(){
    if(drawing){
      // descartar trazos minúsculos
      const a=drawing; const first=a.pts[0], last=a.pts[a.pts.length-1];
      if(a.pts.length>=2 && Math.hypot((last.x-first.x),(last.y-first.y))>0.02){
        frame().arrows.push(a); save();
      }
      drawing=null; render();
    }
    if(drag){ drag=null; save(); }
  }
  court.addEventListener('pointerup',endDraw);
  court.addEventListener('pointercancel',endDraw);

  function eraseAt(sp){
    const arr=frame().arrows;
    for(let i=arr.length-1;i>=0;i--){
      const a=arr[i];
      if(a.pts.some(p=>Math.hypot(p.x-sp.fx,p.y-sp.fy)<0.05) || nearSeg(a,sp)){
        arr.splice(i,1); save(); render(); return;
      }
    }
  }
  function nearSeg(a,sp){
    for(let i=0;i<a.pts.length-1;i++){
      const A=a.pts[i],B=a.pts[i+1];
      const t=Math.max(0,Math.min(1,((sp.fx-A.x)*(B.x-A.x)+(sp.fy-A.y)*(B.y-A.y))/(((B.x-A.x)**2+(B.y-A.y)**2)||1e-6)));
      const px=A.x+t*(B.x-A.x), py=A.y+t*(B.y-A.y);
      if(Math.hypot(sp.fx-px,sp.fy-py)<0.04) return true;
    }
    return false;
  }
  const clamp=v=>Math.max(0.02,Math.min(0.98,v));

  // ============================================================
  //  Reproducción (fichas en movimiento)
  // ============================================================
  function stopAnim(){ if(anim&&anim.raf) cancelAnimationFrame(anim.raf); anim=null; setPlayIcon(false); }
  function setPlayIcon(playing){
    $('#pPlay').innerHTML = playing
      ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  }
  function ease(t){ return t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; }

  function playFrom(startIdx){
    const p=play();
    stopAnim();
    if(startIdx>=p.frames.length-1) startIdx=0;
    const speed=parseFloat($('#speed').value)||1;
    anim={idx:startIdx, t0:performance.now(), speed, playing:true};
    setPlayIcon(true);
    showNote(startIdx);
    runStep();
  }
  function runStep(){
    const p=play();
    if(!anim||!anim.playing) return;
    const i=anim.idx;
    if(i>=p.frames.length-1){ stopAnim(); curFrame=p.frames.length-1; render(); updateScrub(); showNote(curFrame,true); return; }
    const from=p.frames[i].pos, to=p.frames[i+1].pos;
    const dur=1000/anim.speed;   // por tramo (el "hold" lo damos con la nota)
    const hold=700/anim.speed;
    const now=performance.now();
    const elapsed=now-anim.t0;
    if(elapsed<hold){ // pausa mostrando el paso destino a punto de moverse
      // mostramos posiciones del frame i y flechas del destino
      render(from, p.frames[i+1].arrows);
      curFrame=i; updateScrub();
      anim.raf=requestAnimationFrame(runStep); return;
    }
    const t=Math.min(1,(elapsed-hold)/dur);
    const e=ease(t);
    const pos={};
    for(const k in to){ const a=from[k]||to[k], b=to[k]; pos[k]={x:a.x+(b.x-a.x)*e, y:a.y+(b.y-a.y)*e}; }
    render(pos, p.frames[i+1].arrows);
    if(t>=1){
      anim.idx=i+1; anim.t0=performance.now(); curFrame=i+1; updateScrub(); showNote(i+1);
    }
    anim.raf=requestAnimationFrame(runStep);
  }
  function showNote(i,keep){
    const p=play(); const f=p.frames[i]; const ov=$('#noteOverlay');
    $('#noteKicker').textContent='Paso '+(i+1)+' / '+p.frames.length;

    ov.classList.toggle('show', mode==='present');

  function updateScrub(){

  function exportPNG(){
    const p=play(); const {w,h}=VB[p.court]; const scale=2;
    const svg=court.cloneNode(true);
    svg.setAttribute('width',w*scale); svg.setAttribute('height',h*scale);
    // resolver variables CSS a valores concretos
    const cs=getComputedStyle(document.documentElement);
    let s=new XMLSerializer().serializeToString(svg);
    s=s.replace(/var\((--[\w-]+)\)/g,(m,v)=>cs.getPropertyValue(v).trim()||m);
    const img=new Image();
    const blob=new Blob([s],{type:'image/svg+xml'});
    const url=URL.createObjectURL(blob);
    img.onload=()=>{
      const cv=document.createElement('canvas'); cv.width=w*scale; cv.height=h*scale;
      const cx=cv.getContext('2d'); cx.drawImage(img,0,0);
      URL.revokeObjectURL(url);
      cv.toBlob(b=>saveFile((p.name||'jugada')+'.png', b));
    };
    img.onerror=()=>toast('No se pudo exportar');
    img.src=url;
  }
  // Guardar archivo: usa la capacidad de descargas del artifact si existe,
  // si no, recurre al método clásico (útil al abrir el archivo directamente).
  async function saveFile(filename, data){
    try{
      const dl = (window.claude && typeof claude.use==='function') ? await claude.use('downloads') : null;
      if(dl){ await dl.save({filename, data}); toast('Guardado'); return; }
    }catch(err){
      if(err && err.code==='declined') return;
      if(err && (err.code==='rate_limited')){ toast('Intenta de nuevo'); return; }
      /* otros errores → respaldo */
    }
    try{
      const blob = data instanceof Blob ? data
        : new Blob([data], {type: filename.endsWith('.png')?'image/png':'application/json'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a'); a.href=url; a.download=filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),2000);
    }catch(e){ toast('No se pudo guardar'); }
  }

  function loadStats(){
    try{ roster=JSON.parse(localStorage.getItem(ROSTER_KEY))||[]; }catch(e){ roster=[]; }

    viewPeriod=game.period;

  // Contadores de un jugador en un cuarto (reconstruidos desde el registro)
  function periodCnt(id,q){
    const c=emptyCnt();
    (game.log||[]).forEach(function(e){ if(e.p===id && (e.q||1)===q){ const a=ACTIONS.find(x=>x.id===e.a); if(a) for(const k in a.inc) c[k]+=(a.inc[k]||0); } });
    return c;
  }

      +'<div style="padding:12px 14px;border-top:1px solid #26332b;display:flex;gap:8px;justify-content:space-between"><button id="convParche" style="background:#0c120f;border:1px solid #33443a;color:#eaf2ec;border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600">＋ Parche</button><button id="convClose" style="background:#1f9b57;border:0;color:#fff;font-weight:700;border-radius:10px;padding:9px 18px;cursor:pointer">Listo</button></div></div>';
    document.body.appendChild(ov);
    const upd=function(){ ov.querySelector('#convCount').textContent=ov.querySelectorAll('input:checked').length+' presentes'; };
    [].forEach.call(ov.querySelectorAll('input'),function(ch){ ch.onchange=function(){ var id=ch.getAttribute('data-id');
      if(ch.checked){ if(game.present.indexOf(id)<0) game.present.push(id); } else { game.present=game.present.filter(function(x){return x!==id;}); if(selPlayer===id) selPlayer=null; }
      saveGame(); upd(); }; });
    ov.querySelector('#convParche').onclick=function(){ ov.remove(); addParche(); };
    ov.querySelector('#convClose').onclick=function(){ ov.remove(); renderStats(); };
    upd();
  }

  // ---- Plantel del equipo (nombre, número, estatura, fecha de nacimiento) ----

    document.body.appendChild(ov);

    function rows(){

        +'<span style="flex:1;min-width:70px">'+escapeHtml(p.name)+(p.tmp?' <span style="color:#f0982a;font-size:.7rem">parche</span>':'')+'</span>'
        +'<span style="color:#9fb0a5;font-size:.85rem;width:56px;text-align:right">'+escapeHtml(p.height||'')+'</span>'
        +'<span style="color:#9fb0a5;font-size:.85rem;width:92px;text-align:right">'+escapeHtml(p.birth||'')+'</span>'
        +(ro?'':'<button data-edit="'+p.id+'" title="Editar" style="background:none;border:0;color:#7ccbe0;cursor:pointer;font-size:1rem;padding:0 6px">✎</button><button data-del="'+p.id+'" title="Quitar" style="background:none;border:0;color:#b55;cursor:pointer;font-size:1.25rem;padding:0 4px">×</button>')
      +'</div>'; }).join('');

    function draw(){
      ov.innerHTML='<div style="background:#101613;border:1px solid #26332b;border-radius:16px;max-width:600px;width:100%;color:#eaf2ec;max-height:92vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 60px -20px #000">'
        +'<div style="padding:14px 18px;border-bottom:1px solid #26332b;display:flex;justify-content:space-between;align-items:center"><b style="font-size:1.15rem">Plantel del equipo</b><button id="plX" style="background:none;border:0;color:#8aa;font-size:1.5rem;cursor:pointer;line-height:1">&times;</button></div>'
        +(ro?'<div style="padding:9px 16px;background:#2e2210;color:#f0982a;font-size:.82rem">Green Bears es de solo lectura: su plantel se gestiona desde el sitio / la cuenta greenbears.</div>':'')
        +'<div id="plList" style="padding:4px 16px;overflow:auto">'+rows()+'</div>'
        +(ro?'':'<form id="plForm" style="display:flex;flex-direction:column;gap:9px;padding:14px 16px;border-top:1px solid #26332b">'
            +'<input id="plName" placeholder="Nombre" maxlength="24" required style="'+inp+'">'
            +'<div style="display:flex;gap:8px">'
              +'<input id="plNum" placeholder="N°" maxlength="3" style="'+inp+';width:74px;flex:none;text-align:center">'
              +'<input id="plHeight" placeholder="Estatura (ej: 1.85 m)" style="'+inp+';flex:1;min-width:0">'
            +'</div>'
            +'<label style="display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:#9fb0a5">Fecha de nacimiento'
              +'<input id="plBirth" type="date" style="'+inp+'"></label>'
            +'<button id="plSave" style="background:#1f9b57;border:0;color:#fff;font-weight:700;border-radius:10px;padding:11px;cursor:pointer">Agregar jugador</button>'
          +'</form>')
        +'</div>';
      ov.querySelector('#plX').onclick=function(){ ov.remove(); };
      if(ro) return;
      ov.querySelector('#plForm').onsubmit=function(e){ e.preventDefault();
        const name=ov.querySelector('#plName').value.trim(); if(!name) return;
        const num=ov.querySelector('#plNum').value.trim().slice(0,3);
        const height=ov.querySelector('#plHeight').value.trim();
        const birth=ov.querySelector('#plBirth').value;
        if(editing){ const p=roster.find(x=>x.id===editing); if(p){ p.name=name.slice(0,24); p.num=num; p.height=height; p.birth=birth; } editing=null; }
        else { roster.push({id:uid(), name:name.slice(0,24), num, height, birth}); }
        saveRoster(); renderStats(); draw();
      };
      [].forEach.call(ov.querySelectorAll('[data-edit]'),function(b){ b.onclick=function(){ const p=roster.find(x=>x.id===b.getAttribute('data-edit')); if(!p)return; editing=p.id;
        ov.querySelector('#plName').value=p.name||''; ov.querySelector('#plNum').value=p.num||''; ov.querySelector('#plHeight').value=p.height||''; ov.querySelector('#plBirth').value=p.birth||'';
