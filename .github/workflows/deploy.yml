name: Deploy greenbears.cl (VPS)

# Cada push a main entra por SSH al VPS, actualiza el repo y reconstruye SOLO
# el contenedor de la web (grap-greenbears). No toca GrapHCM.
#
# Requiere 3 secrets en este repo (Settings → Secrets and variables → Actions):
#   SSH_HOST, SSH_USER, SSH_KEY   (opcional: SSH_PORT)
# La ruta de Caddy y la conexión de red se hacen UNA vez a mano (ver README).

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar configuración
        id: check
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          if [ -z "$SSH_HOST" ]; then
            echo "::notice::SSH_HOST no configurado — se salta el deploy. Agrega SSH_HOST, SSH_USER y SSH_KEY."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy por SSH
        if: steps.check.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            set -e
            cd ~/greenbears-web || { echo "Falta clonar ~/greenbears-web una vez (ver README)"; exit 1; }
            # Sincroniza el código EXACTO del repo. Se usa fetch + reset --hard (en vez de
            # git pull) para que el deploy no se caiga si en el servidor quedaron cambios
            # locales o archivos que chocan. Es seguro para los datos: data/ y .env están en
            # .gitignore, así que la base (data/greenbears.db) y la config NO se tocan.
            git fetch origin main
            git reset --hard origin/main
            [ -f .env ] || { echo "Falta ~/greenbears-web/.env con ADMIN_PASSWORD y SESSION_SECRET (créalo una vez)"; exit 1; }
            docker compose --env-file .env up -d --build --force-recreate
            # Conecta Caddy a la red aislada para poder enrutar (idempotente).
            docker network connect greenbears_edge grap-caddy 2>/dev/null || true
            # Agrega el dominio al Caddyfile de GrapHCM solo si falta (no pisa lo existente).
            CADDY="$HOME/graphcm/deploy/caddy/Caddyfile"
            if [ -f "$CADDY" ] && ! grep -q 'greenbears.cl' "$CADDY"; then
              printf '\ngreenbears.cl {\n\tencode zstd gzip\n\treverse_proxy grap-greenbears:3000\n}\nwww.greenbears.cl {\n\tredir https://greenbears.cl{uri} permanent\n}\n' >> "$CADDY"
              docker compose -f "$HOME/graphcm/docker-compose.unified.yml" --env-file "$HOME/graphcm/deploy/.env" up -d --force-recreate caddy
            fi
            docker image prune -f
